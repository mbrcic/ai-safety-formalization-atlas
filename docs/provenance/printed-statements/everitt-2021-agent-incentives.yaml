source:
  citation: >-
    Tom Everitt, Ryan Carey, Eric D. Langlois, Pedro A. Ortega and Shane Legg,
    Agent Incentives: A Causal Perspective. The Thirty-Fifth AAAI Conference on
    Artificial Intelligence (AAAI-21), pp. 11487-11495 (published PDF). Sections
    Setup, Materiality, Value of Information, Instrumental Control Incentive.
  file: everitt-etal-2021-aaai-ojs.pdf
  sha256: 31d4a4b277c562b82000c4d2b81660e89464877ec0cad3549a9375c6d4492598
  page_offset: -11486
  version_note: >-
    The audit (section 8) pins the AAAI published PDF, so this file is transcribed
    from it; map.tsv and source card S08 point at the arXiv version
    everitt-carey-langlois-ortega-legg-2021-aaai-agent-incentives.pdf
    (arXiv:2102.01685v2, sha256
    e1d9324532870d4a2604a82a9e4865207b8e21cec94524bb662f3a0470b4ee45). The card's
    pdf_page numbers coincide with the published PDF pages for every row here
    (2, 3, 4, 6). Definitions 1-7, 17 and Theorem 18 carry the same numbers and the
    same wording in both (text layers compared token by token; remaining
    differences are column-order artefacts; Definition 17's sentence and (2) were
    compared directly). Printed page = PDF page + 11486 (p. 1 is 11487, p. 6 is
    11492, checked on the images).
  standing: |
    Single decision (p. 3, right column, after Definition 4): "We will restrict our
    attention to single-decision settings with $\boldsymbol{D} = \{D\}$." The
    definitions of SCM, CID and SCIM themselves are not restricted to one decision.

    Notation (p. 2, after Definition 2): "Throughout this paper we use subscripts to
    indicate submodels or interventions, and superscripts for indexing."

    Causal reading of CIDs (p. 2-3): "We will assume that the edges of the influence
    diagram reflect the causal structure of the environment, so we use the term
    `Causal Influence Diagram'." Footnote 2 (p. 3): "In contrast to subsequent
    sections, the results in this section and the VoI section do not require the
    influence diagrams to be causal."

    Silences recorded by source card S08 (pages searched: 2-3, 6): no finiteness of
    the vertex set or of parent sets, and no well-foundedness beyond "acyclic", is
    stated; Definitions 1 and 3 impose no finiteness of domains (Definition 4 is the
    first place finite domains appear); no common bound on utilities beyond the
    finite real-valued domains of Definition 4; Definition 17 states no positivity
    of the probability of the decision context and does not quantify the $d$ in (2).

definitions:
  - id: ec21-scm-joint
    label: joint distribution induced by an SCM (prose after Definition 1)
    pdf_page: 2
    book_page: 11488
    latex: |
      The exogenous variables $\boldsymbol{\mathcal{E}}$ of an SCM represent factors
      that are not modelled. For any value $\boldsymbol{\mathcal{E}} =
      \boldsymbol{\varepsilon}$ of the exogenous variables, the value of any set of
      variables $\boldsymbol{W} \subseteq \boldsymbol{V}$ is given by recursive
      application of the structural functions $\boldsymbol{F}$ and is denoted by
      $\boldsymbol{W}(\boldsymbol{\varepsilon})$. Together with the distribution
      $P(\boldsymbol{\varepsilon})$ over exogenous variables, this induces a joint
      distribution $\Pr(\boldsymbol{W} = \boldsymbol{w}) =
      \sum_{\{\boldsymbol{\varepsilon} | \boldsymbol{W}(\boldsymbol{\varepsilon}) =
      \boldsymbol{w}\}} P(\boldsymbol{\varepsilon})$.
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 200}
    checked: {by: 'Codex (anchored); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

  - id: ec21-potential-response
    label: potential response and nested counterfactual (prose after Definition 2)
    pdf_page: 2
    book_page: 11488
    latex: |
      If $W$ is a variable in an SCM $\mathcal{M}$, then $W_{\boldsymbol{x}}$ refers
      to the same variable in the submodel $\mathcal{M}_{\boldsymbol{x}}$ and is
      called a \emph{potential response variable}. [\ldots]

      More elaborate hypotheticals can be described with a nested counterfactual, in
      which the intervention is itself a potential response variable. In Figure 2c,
      the \emph{click} probability $U$ depends on both the chosen \emph{posts} $D$
      and the user \emph{opinion} $O$, which is in turn also influenced by $D$. The
      nested potential response variable $U_{O_d}$, defined by
      $U_{O_d}(\boldsymbol{\varepsilon}) := U_o(\boldsymbol{\varepsilon})$ where
      $o = O_d(\boldsymbol{\varepsilon})$, represents the probability that a user
      clicks on a ``default'' post $D$ given that their opinion has been influenced
      by a hypothetical post $d$. In other words, the effect of the intervention
      $\mathrm{do}(D = d)$ is propagated to $U$ only through $O$.
    note: >-
      The nested counterfactual is defined only by this example; Definition 17 uses
      $\mathcal{U}_{X_d}$ by analogy.
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 200}
    checked: {by: 'Codex (anchored); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

  - id: ec21-graph-notation
    label: parents, descendants, observations, information links, directed paths (prose after Definition 3)
    pdf_page: 3
    book_page: 11489
    latex: |
      We use $\mathbf{Pa}^V$ and $\mathbf{Desc}^V$ to denote the parents and
      descendants of a node $V \in \boldsymbol{V}$. The parents of the decision,
      $\mathbf{Pa}^D$, are also called observations. An edge from node $V$ to node
      $Y$ is denoted $V \to Y$. Edges into decisions are called information links,
      as they indicate what information is available at the time of the decision. A
      directed path (of length at least zero) is denoted $V \dashrightarrow Y$. For
      sets of variables, $\boldsymbol{V} \dashrightarrow \boldsymbol{Y}$ means that
      $V \dashrightarrow Y$ holds for some $V \in \boldsymbol{V}$,
      $Y \in \boldsymbol{Y}$.
    note: >-
      Whether $\mathbf{Desc}^V$ includes $V$ is not stated; the length-zero
      convention is stated for directed paths only.
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 200}
    checked: {by: 'Codex (anchored); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

  - id: ec21-policy-completion
    label: policy completion $\mathcal{M}_\pi$ (prose after Definition 4)
    pdf_page: 3
    book_page: 11489
    latex: |
      The specification of a policy turns a SCIM $\mathcal{M}$ into an SCM
      $\mathcal{M}_\pi := \langle \boldsymbol{\mathcal{E}}, \boldsymbol{V},
      \boldsymbol{F} \cup \{\pi\}, P \rangle$, see Figure 2b. With the resulting SCM,
      the standard definitions of causal interventions apply.
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 200}
    checked: {by: 'Codex (anchored); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

