source:
  citation: >-
    Jonathan Richens and Tom Everitt, Robust agents learn causal world models.
    Published as a conference paper at ICLR 2024 (proceedings PDF, 32 pp.).
    Section 2 and Appendices A.1, A.2, B.
  file: richens-everitt-2024-iclr-proceedings.pdf
  sha256: 143d458cbee2f4f5d04d7380f6741e8105965d1ee94834e1ddb3bd231722a0e7
  page_offset: 0
  version_note: >-
    The audit (section 6) pins the proceedings PDF, so this file is transcribed
    from it. map.tsv and source card S06 point at the arXiv working text
    richens-everitt-2024-iclr-robust-agents-learn-causal-world-models.pdf
    (sha256 b25a2c7e8fe27d1dfd00299166197d8f3bd2ac8af7102f3b2a07585cfd6743b2), whose
    pdf_page numbers are those on the card. For every statement below the two texts
    agree word for word (text layers of PDF pp. 2-3 and of proceedings pp. 14-18 /
    arXiv pp. 15-19 compared token by token; the only differences are page numbers
    and two words "in turn" elsewhere on p. 2-3). Section 2 is on the same PDF pages
    in both; Appendix A-B pages are one higher in the arXiv text (proceedings p. n =
    arXiv p. n+1). Printed page = PDF page in the proceedings.
  standing: |
    Finite domains (§2.1, p. 2): "We use capital letters for random variables $V$,
    and lower case for their values $v \in dom(V)$. For simplicity, we assume each
    variable has a finite number of possible values, $|dom(V)| < \infty$. Bold face
    denotes sets of variables $\boldsymbol{V} = \{V_1, \ldots, V_n\}$, and their
    values $\boldsymbol{v} \in dom(\boldsymbol{V}) = \times_i dom(V_i)$."

    Single decision, single utility (§2.2, p. 3): "For simplicity we focus on tasks
    involving a single decision and a single utility function." [\ldots] "The
    utility is any real-valued function including standard loss and reward
    functions."

    Environment (§2.2, p. 3): "We assume that the environment is described by a set
    of random variables $\boldsymbol{C}$ that interact via causal mechanisms, and
    where $\boldsymbol{C}$ satisfies causal sufficiency (Pearl, 2009) (includes all
    common causes), noting that such a choice of $\boldsymbol{C}$ always exists. We
    refer to the CBN over $\boldsymbol{C}$ as the `true' or `underlying' CBN. Note we
    do not assume the agent has any knowledge of the underling CBN, nor do we assume
    which variables in $\boldsymbol{C}$ are observed or unobserved by the agent,
    beyond that the agent can observe $\mathbf{Pa}_D \subseteq \boldsymbol{C}$. We
    also assume knowledge of the utility function $U(\mathbf{Pa}_U)$."

    Appendix A.1 (p. 14): "The environment is described by a set of random
    variables $\boldsymbol{C} = \{C_1, C_2, \ldots, C_N\}$, which in combination with
    the decision $D$ and utility nodes $U$ define the state space for the CID
    $\boldsymbol{V} = \boldsymbol{C} \cup \{D, U\}$."

    Restriction to unmediated, non-trivial tasks (Appendix A.1, p. 15): "In the
    following we restrict our attention to a class of CIDs we refer to as
    `unmediated decision tasks', where where the agent's decision does not causally
    influence any chance variables that go on to influence the utility." [\ldots]
    "Furthermore, we will focus on non-trivial unmediated decision tasks i.e. where
    $U \in \mathbf{Ch}_D$, as the case $\mathbf{Ch}_D = \emptyset$ describes trivial
    decision tasks (the agent's action does not influence the utility)."

    Domain dependence (Assumption 2, p. 4 and again p. 15) is imposed from Lemma 1
    on; transcribed under definitions as re24-assumption-2.

    Appendix A.2 (p. 16): "We restrict our attention to $\boldsymbol{C}$ that are
    categorical, and without loss of generality we label states
    $c_i = 0, 1, \ldots, \dim_i - 1$ where $\dim_i$ is the dimension of variable
    $C_i$."

definitions:
  - id: re24-def-1
    label: Definition 1 (Bayesian networks)
    pdf_page: 2
    book_page: 2
    latex: |
      \textbf{Definition 1} (Bayesian networks)\textbf{.} \emph{A Bayesian network
      $M = (G, P)$ over a set of variables $\boldsymbol{V} = \{V_1, \ldots, V_n\}$ is
      a joint probability distribution $P(\boldsymbol{V})$ that factors according to
      a directed acyclic graph (DAG) $G$, i.e.
      $P(V_1, \ldots, V_n) = \prod_{i=1}^{n} P(V_i \mid \boldsymbol{Pa}_{V_i})$,
      where $\boldsymbol{Pa}_{V_i}$ are the parents of $V_i$ in $G$.}
    note: Repeated verbatim in Appendix A.1, p. 14.
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 130}
    checked: {by: 'Codex (anchored); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

  - id: re24-hard-intervention
    label: hard intervention (§2.1 prose)
    pdf_page: 2
    book_page: 2
    latex: |
      Interventions describe external changes to the data generating process (and
      hence changing the joint distribution), for example a \emph{hard} intervention
      $\mathrm{do}(\boldsymbol{X} = \boldsymbol{x})$ describes forcing the set of
      variables $\boldsymbol{X} \subseteq \boldsymbol{V}$ to take value
      $\boldsymbol{x}$. This generates a new distribution
      $P(\boldsymbol{V} \mid \mathrm{do}(\boldsymbol{X} = \boldsymbol{x})) =
      P(\boldsymbol{V}_{\boldsymbol{x}})$ where $\boldsymbol{V}_{\boldsymbol{x}}$
      refers to the variables $\boldsymbol{V}$ following this intervention.
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 130}
    checked: {by: 'Codex (anchored); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

  - id: re24-soft-intervention
    label: soft intervention (§2.1 prose)
    pdf_page: 2
    book_page: 2
    latex: |
      More generally, a \emph{soft} intervention
      $\sigma_{v_i} = P'(V_i \mid \mathbf{Pa}^*_i)$ replaces the conditional
      probability distribution for $V_i$ with a new distribution
      $P'(V_i \mid \mathbf{Pa}^*_i)$, possibly resulting in a new parent set
      $\mathbf{Pa}^*_i \neq \mathbf{Pa}_i$ as long as no cycles are introduced in the
      graph. We refer to $\sigma_{v_i}$ as a \emph{domain indicator} (Correa \&
      Bareinboim, 2020) (it has also been called an environment index, Arjovsky et
      al., 2019). The updated distribution is denoted
      $P(\boldsymbol{v}; \sigma_{\boldsymbol{v}'}) =
      \prod_{i: v_i \in \boldsymbol{v}'} P'(v_i \mid \mathbf{pa}^*_{v_i})
      \prod_{i: v_i \notin \boldsymbol{v}'} P(v_i \mid \mathbf{pa}_{v_i})$.
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 130}
    checked: {by: 'Codex (anchored); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

  - id: re24-anc-desc
    label: parents, ancestors, children, descendants (Appendix A.1 prose)
    pdf_page: 14
    book_page: 14
    latex: |
      With respect to the causal graph $G$ we denote the direct causes (parents) of
      $V_i$ as $\mathbf{Pa}_i$, the set of all causes (ancestors) $\mathbf{Anc}_i$,
      and the variables that $V_i$ directly causes (children) $\mathbf{Ch}_i$ and
      descendants $\mathbf{Desc}_i$ as the set of all downstream variables. Note in
      particular that $\mathbf{Anc}_i$ and $\mathbf{Desc}_i$ refer to \emph{proper}
      ancestors and descendants, i.e. $V_i \notin \mathbf{Anc}_i$ and
      $V_i \notin \mathbf{Desc}_i$.
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 130}
    checked: {by: 'Codex (anchored); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

  - id: re24-assumption-2
    label: Assumption 2 (Domain dependence)
    pdf_page: 4
    book_page: 4
    latex: |
      \textbf{Assumption 2} (Domain dependence)\textbf{.} \emph{There exists
      $P(\boldsymbol{C} = \boldsymbol{c})$ and $P'(\boldsymbol{C} = \boldsymbol{c})$
      compatible with $M$ such that
      $\pi^* = \arg\max_\pi \mathbb{E}^\pi_P[U]$ implies
      $\pi^* \neq \arg\max_\pi \mathbb{E}^\pi_{P'}[U]$.}
    note: >-
      Repeated verbatim on p. 15, preceded there by "we say that a decision task is
      \emph{domain independent} if there exists a single policy that is optimal for
      all choices of environment distribution $P(\boldsymbol{C} = c)$."
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 130}
    checked: {by: 'Codex (anchored); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

  - id: re24-lemma-1
    label: Lemma 1
    pdf_page: 15
    book_page: 15
    latex: |
      \textbf{Lemma 1.} \emph{Domain dependence implies that;}

      \emph{i) There exists no $d \in dom(D)$ such that
      $d \in \arg\max_d U(d, c)\ \forall \boldsymbol{c} \in dom(C)$.}

      \emph{ii) $\boldsymbol{Pa}_D \subsetneq \boldsymbol{Anc}_U$}

      \emph{iii) $D \in \boldsymbol{Pa}_U$}
    note: >-
      In i) as printed, $c$ in $U(d, c)$ and $C$ in $dom(C)$ are not bold while the
      bound $\boldsymbol{c}$ is (confirmed on a 220 dpi crop).
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 130}
    checked: {by: 'Codex (anchored); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

