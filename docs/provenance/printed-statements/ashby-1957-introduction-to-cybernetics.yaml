excerpts:
  - id: ashby-11-8-derivation
    for: [ashby-11-8]
    reason: >-
      Printed slip in the conclusion of §11/8 ($H_D(E)$ for $H_D(R)$); this
      derivation, immediately preceding it, carries $H_D(R)$ throughout.
    pdf_page: 110
    latex: |
      Now whatever the causal or other relations between $D$, $R$ and $E$,
      algebraic necessity requires that their entropies must be related so that
      \[ H(D) + H_D(R) = H(R) + H_R(D) \]
      for each side of the equation equals $H(R,D)$. Substitute $\mathrm{H_R}(E)$
      for $\mathrm{H_R}(D)$, and we get
      \[ H(D) + H_D(R) \le H(R) + H_R(E) \]
      \[ \le H(R,E). \]
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 200}
    checked: {by: 'Codex (anchored); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

  - id: ashby-11-9-entropy
    for: [ashby-11-9]
    reason: >-
      Printed slip "$\log V_R$" in §11/9; the entropy form of the same extension,
      in the same section, subtracts $H(R)$ with no logarithm, showing the intended
      shape $V_D - \log k - V_R$ with $K$ in the role of $\log k$.
    pdf_page: 111
    latex: |
      An exactly similar modification may be made to the theorem in terms of
      entropies, by supposing, not as in S.11/8 that
      \[ H_R(E) \ge H_R(D), \text{ but that} \]
      \[ H_R(E) \ge H_R(D) - K. \]
      \emph{H(E)'s} minimum then becomes
      \[ H(D) - K - H(R), \]
      with a similar interpretation.
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 200}
    checked: {by: 'Codex (anchored); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}
