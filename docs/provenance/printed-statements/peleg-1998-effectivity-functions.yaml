  - id: peleg-def-3.3-alpha-effective
    audit_row: S21-R19
    locator: Definition 3.3
    pdf_page: 7
    book_page: 73
    label: Definition 3.3 (first sentence pair)
    latex: |
      \textbf{Definition 3.3.} Let $\Gamma = \langle N; \Sigma^1, \ldots, \Sigma^n;
      g; A \rangle$ be a GF, let $S \subset N$, $S \ne \emptyset$, and let
      $B \subset A$. $S$ is $\alpha$-\emph{effective} for $B$ if there exists
      $\sigma_0^S \in \Sigma^S = \times_{i \in S} \Sigma^i$ such that for all
      $\sigma^{N \setminus S} \in \Sigma^{N \setminus S}$ $g(\sigma_0^S,
      \sigma^{N \setminus S}) \in B$.
    uses: [peleg-def-3.2]
    note: >-
      alpha-effectiveness is defined only for non-empty coalitions S.
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 200}
    checked: {by: 'Codex (blind) + Grok (blind); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

