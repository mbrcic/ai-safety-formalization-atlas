      \[ E_\alpha(S; \Gamma) = \{B \subset S \mid S \emph{ is } \alpha\text{-effective
         for } B\} \]
      and $E_\alpha(\emptyset; \Gamma) = A$. Then $E_\alpha(\bullet; \Gamma)$ is the
      $\alpha$-\emph{EF} of $\Gamma$ (in particular, it is an EF).
