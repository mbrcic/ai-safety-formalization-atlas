      \textbf{Definition 3.2.} A \emph{game form} (GF) is a list $\Gamma = \langle N;
      \Sigma^1, \ldots, \Sigma^n; g; A \rangle$ where $N$ is the set of members of the
      society; $\Sigma^i$ is the non-empty set of \emph{strategies} of $i \in N$;
      $g : \Sigma^1 \times \cdots \times \Sigma^n \to A$, is the \emph{outcome
      function}; and $A$ is the set of social states.
