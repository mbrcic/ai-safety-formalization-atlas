  - id: peleg-def-3.3-gamma-monotone-alternatives
    audit_row: S21-R12
    locator: (3.3)
    pdf_page: 6
    book_page: 72
    label: (3.3)
    latex: |
      $\gamma : 2^N \times 2^\rho \to\to 2^A$ is \emph{monotonic with respect to}
      (w.r.t.) \emph{the alternatives if} for all $S \in 2^N$ and all
      $\theta \in 2^\rho$.
      (3.3) $[B \in \gamma(S, \theta)$ and $B^* \supset B] \Rightarrow
      [B^* \in \gamma(S, \theta)]$.
    context: |
      Printed after (3.5): "(3.3) is always satisfied if the constitution is
      coherent, that is $E$ (see (3.1)) can be represented by a game form (see
      Definition 3.4). In this case $B \in \gamma(S, \theta)$ may be interpreted as
      follows: If $S$ has the set of rights $\theta$, then, by exercising its rights
      ``properly'', $S$ may force the social outcome to be an element of $B$."
    uses: [peleg-def-society]
    note: >-
      The quantifier sentence ends with a period before the display (3.3), as
      printed. B and B* are not explicitly quantified; their range (subsets of A) is
      implicit. The condition is imposed at every theta in 2^rho, not only at
      theta = alpha(S); see excerpt peleg-offdiagonal-gamma.
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 200}
