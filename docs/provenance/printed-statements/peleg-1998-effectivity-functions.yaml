  - id: peleg-thm-3.5
    audit_row: S21-R23
    locator: Theorem 3.5
    pdf_page: 7
    book_page: 73
    label: Theorem 3.5
    latex: |
      \textbf{Theorem 3.5.} \emph{Let $E : 2^N \to\to 2^A$ be the EF which is derived
      by} (3.1). \emph{Then there exists a GF $\Gamma = \langle N; \Sigma^1, \ldots,
      \Sigma^n; g; A \rangle$ such that $E_\alpha(S; \Gamma) = E(S)$ for all
      $S \in 2^N$ iff the following two conditions hold}:
      (i) \emph{$\gamma$ is monotonic w.r.t. the alternatives};
      (ii) E \emph{is superadditive.}
    context: |
      Followed by: "The proof is given in the appendix. For a proof when $A$ is
      finite see Moulin (1983)."
    uses: [peleg-eq-3.1, peleg-def-3.2, peleg-def-3.3-alpha-ef, peleg-def-3.3-gamma-monotone-alternatives, peleg-def-3.1, peleg-def-ef]
    proof_pages: 13-14
    note: >-
      Condition (i) is printed on gamma (i.e. (3.3) at every theta), while the
      appendix's Theorem 3.5*, from which Theorem 3.5 is said to follow, states
      monotonicity w.r.t. the alternatives for E (excerpt peleg-thm-3.5-star); see
      also excerpt peleg-offdiagonal-gamma. The "E" in (ii) is printed upright.
      The appendix proves Theorem 3.5* with N = \{1, ..., n\}, n >= 2, A finite or
      infinite with |A| >= 2 if finite, relative to a structure B.
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 200}
    checked: {by: 'Codex (blind); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

  - id: peleg-examples-3
    audit_row: S21-R24
    locator: Examples 3.6, 3.7, 3.8
    pdf_page: 7-8
    book_page: 73-74
    label: Examples 3.6 (PDF 7-8), 3.7 (PDF 8), 3.8 (PDF 8)
    latex: |
      \textbf{Example 3.6.} Consider the society of Example 2.3. (3.1) yields the
      following EF $E$: $E(\emptyset) = A$ and $E(S) = \gamma(S, \rho_1)$ for
      $S \ne \emptyset$. Let $\hat{w}(\hat{b})$ be the strategy ``choose a white
      (blue) shirt''. Then the GF $\Gamma = \langle N; \{\hat{w}, \hat{b}\},
      \{\hat{w}, \hat{b}\}; g; A \rangle$, where $g$ is given by $g(\hat{x}^1,
      \hat{x}^2) = (x^1, x^2)$ for all $x^1, x^2 \in \{w, b\}$, is a representation of
      $E$. According to $\Gamma$, the two members choose their shirt simultaneously.

      \textbf{Example 3.7.} Let $\Sigma^1 = \{\hat{w}, \hat{b}\}$ (see Example 3.6),
      and let $\Sigma^2 = \{f | f\colon \Sigma^1 \to \{w, b\}\}$. Further define
      $g : \Sigma^1 \times \Sigma^2 \to A$ by $g(\hat{x}, f) = (x, f(\hat{x}))$. The GF
      $\Gamma_0 = \langle N; \Sigma^1, \Sigma^2, g, A \rangle$ describes the following
      sequential procedure:
      \emph{Step 1.} 1 chooses her shirt.
      \emph{Step 2.} 2 chooses her shirt after observing 1's choice.
      $\Gamma_0$ is \emph{not} a representation of $E$ (see, again, Example 3.6).
      Indeed, by choosing the strategy $f(\hat{x}) = x$ 2 can force the outcome to be
      in the set $B = \{(w, w), (b, b)\}$. However, $B \notin E(2)$.

      \textbf{Example 3.8.} Now we compute the EF of the society of Example 2.10 by
      means of (3.1): $E(\emptyset) = \{0, e, j\}$; $E(A) = \gamma(A, \rho_1) =
      \{0\}^+$ (see Example 2.10); $E(E) = \gamma(E, \rho_1) = \{0, j\}^+$; $E(J) =
      \gamma(J, \rho_1) = \{0, e\}^+$; $E(\{A, E\}) = \gamma(\{A, E\}, \rho) =
      \{0\}^+ \cup \{e\}^+$; $E(\{A, J\}) = \gamma(\{A, J\}, \rho) = \{0\}^+ \cup
      \{j\}^+$; $E(\{E, J\}) = \gamma(\{E, J\}, \rho_1) = \{0\}^+$, and $E(N) =
      \gamma(N, \rho) = \{0\}^+ \cup \{e\}^+ \cup \{j\}^+$. As the reader may easily
      verify, $E(\bullet)$ is superadditive and monotonic w.r.t. the alternatives.
      Hence, by Theorem 3.5, $E$ is representable. Also, if $A$ is finite then the
      proof of Theorem 3.5 is constructive and, therefore, may be used to obtain
      representations of $E$.
    uses: [peleg-examples-2, peleg-eq-3.1, peleg-def-3.2, peleg-def-3.4, peleg-def-singleton, peleg-def-b-plus, peleg-def-3.1, peleg-thm-3.5]
    note: >-
      Slip in Example 3.7: "by choosing the strategy f(\hat{x}) = x 2 can force",
      with no comma between "x" and "2" (member 2), transcribed as printed. Example
      3.8 says E(\bullet) is "monotonic w.r.t. the alternatives", applying to E the
      property (3.3) defines for gamma. E(\emptyset) = \{0, e, j\} is the singleton
      convention (the family \{A\}). Example 3.7 separates the GF's components with
      commas where Definition 3.2 uses semicolons, as printed.
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 200}
    checked: {by: 'Codex (blind) + Grok (blind); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}
