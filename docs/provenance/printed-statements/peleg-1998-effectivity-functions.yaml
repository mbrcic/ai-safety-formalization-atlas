  - id: peleg-def-3.1
    audit_row: S21-R15
    locator: Definition 3.1
    pdf_page: 6
    book_page: 72
    label: Definition 3.1
    latex: |
      \textbf{Definition 3.1.} An EF $E : 2^N \to\to 2^A$ is \emph{superadditive} if
      for all $S_1, S_2 \in 2^N$, $B_1 \in E(S_1)$ and $B_2 \in E(S_2)$,
      (3.6) $[S_1 \cap S_2 = \emptyset] \Rightarrow [B_1 \cap B_2 \in
      E(S_1 \cup S_2)]$.
    uses: [peleg-def-ef]
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 200}
