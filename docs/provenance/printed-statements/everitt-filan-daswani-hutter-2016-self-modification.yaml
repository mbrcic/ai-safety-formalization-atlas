statements:
  - id: efdh-def-3-stmt
    audit_row: S10-R03
    locator: Def. 3
    pdf_page: 5
    book_page: 5
    label: Definition 3 (Policy self-modification)
    latex: |
      \textbf{Definition 3} (Policy self-modification)\textbf{.} A \emph{policy
      self-modification model} is a modified cybernetic model defined by a quadruple
      $(\check{\mathcal{A}}, \mathcal{E}, \mathcal{P}, \iota)$. $\mathcal{P}$ is a
      non-empty set of \emph{names}. The agent selects actions\textsuperscript{2}
      from $\mathcal{A} = (\check{\mathcal{A}} \times \mathcal{P})$, where
      $\check{\mathcal{A}}$ is a finite set of \emph{world actions}. Let $\Pi =
      \{(\mathcal{A} \times \mathcal{E})^* \to \mathcal{A}\}$ be the set of all
      policies, and let $\iota : \mathcal{P} \to \Pi$ assign names to policies.
    note: >-
      Footnote 2 and the interpretation paragraph that follows (selection
      $a_t = (\check{a}_t, p_{t+1})$, "only policies with names can be selected",
      $\mathcal{P} = \Pi$ impossible) are in source.standing. Same text as
      definition efdh-def-3, listed here as the graded row.
    uses: [efdh-def-3]
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 130}
    checked: {by: 'Codex (blind); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

  - id: efdh-def-12
    audit_row: S10-R12
    locator: Def. 12, eqs. (7) and (8)
    pdf_page: 8
    book_page: 8
    label: Definition 12 (Realistic Value Functions)
    latex: |
      \textbf{Definition 12} (Realistic Value Functions)\textbf{.} A \emph{realistic
      agent} is a policy optimising the \emph{realistic value
      functions}:\textsuperscript{4}
      \[ V_t^{\mathrm{re},\pi}(\ae_{<k}) = Q_t^{\mathrm{re}}(\ae_{<k}\pi(\ae_{<k}))
         \tag{7} \]
      \[ Q_t^{\mathrm{re}}(\ae_{<k} a_k) = \mathbb{E}_{e_k}\left[u_t(\check{\ae}_{1:k})
         + \gamma V_t^{\mathrm{re},\pi_{k+1}}(\ae_{1:k}) \mid \check{\ae}_{<k}
         \check{a}_k\right]. \tag{8} \]
      \textsuperscript{4}Note that a policy argument to $Q^{\mathrm{re}}$ would be
      superfluous, as the action $a_k$ determines the next step policy $\pi_{k+1}$.
    uses: [efdh-def-3, efdh-def-5, efdh-def-7, efdh-optimal-policy]
    note: >-
      "optimising" is given meaning by the paragraph after the definition
      (efdh-optimal-policy), which prints $\sup_{p'} V^{\pi'}(h)$: the bound
      variable under sup is $p'$ while the policy in the superscript is $\pi'$
      (transcribed as printed; read at 220 dpi).
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 220}
    checked: {by: 'Codex (blind) + Codex (anchored re-read); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

  - id: efdh-thm-16
    audit_row: S10-R16
    locator: Thm. 16, eq. (13)
    pdf_page: 11-12
    book_page: 11-12
    label: Theorem 16 (Realistic policy-modifying agents make safe modifications)
    latex: |
      \textbf{Theorem 16} (Realistic policy-modifying agents make safe
      modifications)\textbf{.} \emph{Let $\rho$ and $u_1$ be
      modification-independent. Consider a self-modifying agent whose initial policy
      $\pi_1 = \iota(p_1)$ optimises the realistic value function
      $V_1^{\mathrm{re}}$. Then, for every $t \ge 1$, for all percept sequences
      $e_{<t}$, and for the action sequence $a_{<t}$ given by $a_i =
      \pi_i(\ae_{<i})$, we have}
      \[ Q_1^{\mathrm{re}}(\ae_{<t}\pi_t(\ae_{<t})) =
         Q_1^{\mathrm{re}}(\ae_{<t}\pi_1(\ae_{<t})). \tag{13} \]
    note: >-
      The statement starts at the foot of PDF p. 11 and its quantifiers and
      conclusion are on p. 12. The on-policy remark on p. 13 is in source.standing.
      The proof invokes Theorem 20 (Appendix A) for a non-modifying
      modification-independent optimal policy.
    uses: [efdh-def-3, efdh-def-5, efdh-def-7, efdh-def-12, efdh-optimal-policy]
    proof_pages: 12
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 220}
    checked: {by: 'Codex (blind); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

  - id: efdh-eq-14
    audit_row: S10-R17
    locator: eq. (14)
    pdf_page: 12
    book_page: 12
    label: eq. (14), induction step in the proof of Theorem 16
    latex: |
      We now prove Eq. (13) by induction. That is, assuming that $\pi_t$ picks
      actions optimally according to $Q_1^{\mathrm{re}}$, then $\pi_{t+1}$ will do so
      too:
      \[ Q_1^{\mathrm{re}}(\ae_{<t}\pi_t(\ae_{<t})) = \sup_a
         Q_1^{\mathrm{re}}(\ae_{<t}a) \implies
         Q_1^{\mathrm{re}}(\ae_{1:t}\pi_{t+1}(\ae_{1:t})) = \sup_a
         Q_1^{\mathrm{re}}(\ae_{1:t}a). \tag{14} \]
    context: |
      Inside the proof of Theorem 16; the next sentence gives the base case:
      "The base case of the induction $Q_1^{\mathrm{re}}(\pi_1(\epsilon)) = \sup_a
      Q_1^{\mathrm{re}}(a)$ follows immediately from the assumption of the theorem
      that $\pi_1$ is $V^{\mathrm{re}}$-optimal (recall that $\epsilon$ is the empty
      history)."
    uses: [efdh-def-12, efdh-thm-16]
    proof_pages: 12
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 220}
    checked: {by: 'Codex (blind) + Codex (anchored re-read); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}
