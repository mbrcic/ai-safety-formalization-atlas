source:
  citation: >-
    Ian Carter and Ronen Shnayderman, The Impossibility of ``Freedom as
    Independence''. Political Studies Review, 2018, pp. 1--11,
    DOI 10.1177/1478929918771452, (c) The Author(s) 2018; accepted 21 March 2018
    (first page, PDF p. 1). OnlineFirst text: the running head reads "Political
    Studies Review 00(0)" and carries no volume, issue or journal page numbers, so
    pages below are the article's own 1--11.
  file: carter-shnayderman-2018-earlyview-political-studies-review-impossibility-of-freedom-as-independence.pdf
  sha256: bb5bf47c635036527739b5d65597f0a7b0e6386d5107ebd77fccff942fa07dff
  page_offset: 0
  standing: |
    The two theses are displayed, italic-labelled claims; the paper numbers no
    theorem. Their terms (robustness requirement, arbitrariness requirement,
    freedom as independence) are fixed in the introduction, pp. 1--2 (definitions
    cs-def-requirements and cs-def-freedom-as-independence). The meaning of
    "impunity" used in the asymmetry argument is fixed in note 6, p. 10
    (definition cs-note-6-impunity). Both theses are stated about "relevant
    possibilit[ies]"; which possible worlds are relevant is taken from List and
    Valentini (list-valentini-2016-freedom-as-independence) and not redefined
    here.

definitions:
  - id: cs-def-requirements
    label: the robustness and arbitrariness requirements (introduction)
    pdf_page: 1-2
    book_page: 1-2
    latex: |
      First, republicans have claimed that one is free only if the non-interference
      that one enjoys is robust, where the robustness of non-interference involves an
      absence of interference not only in the actual world but also in a range of
      possible worlds. Second, they have claimed that an interference counts as a
      source of unfreedom only if it is arbitrary, where the arbitrariness of an
      interference depends on a lack of institutional structures forcing it to track
      the interests of those interfered with, as a result of which such interference
      is carried out at will and with impunity. We may call these two requirements,
      respectively, the ``robustness requirement'' and the ``arbitrariness
      requirement.'' Together, they constitute the republican notion of freedom as
      ``non-domination.''
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 130}
    checked: {by: 'Codex (anchored); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

  - id: cs-def-freedom-as-independence
    label: freedom as independence (introduction)
    pdf_page: 2
    book_page: 2
    latex: |
      List and Valentini endorse the robustness requirement but not the arbitrariness
      requirement. Thus, for List and Valentini, freedom is the robust absence of
      constraints, whether arbitrary or non-arbitrary. They call the resulting
      conception ``freedom as independence.''
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 130}
    checked: {by: 'Codex (anchored); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

  - id: cs-note-6-impunity
    label: note 6 (meaning of "impunity")
    pdf_page: 10
    book_page: 10
    latex: |
      6. Pettit does not say what exactly he means by ``impunity.'' We take him to
      mean that we enjoy impunity with respect to a certain act (X) only when we are
      not exposed even to the mere possibility of being punished for X-ing. [\ldots]
      Were Pettit to claim that we enjoy impunity with respect to X-ing as long as we
      are not actually punished for X-ing, then freedom, on his conception, would be
      impossible owing to people's power to interfere with each other's lives within
      the state. For even in a republican state there would always be a possibility
      that any crime will go unpunished.
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 130}
    checked: {by: 'Codex (anchored); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

