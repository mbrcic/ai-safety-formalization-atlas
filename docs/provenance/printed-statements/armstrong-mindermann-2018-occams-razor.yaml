  - id: am-lowest
    audit_row: S20-R23
    locator: §5.1.3 amongst the lowest
    pdf_page: 6
    book_page: 6
    label: definition in text (§5.1.3)
    latex: |
      For a set $S \subset \mathcal{P} \times \mathcal{R}$, the pair
      $(p, R) \in S$ is amongst the lowest complexity in $S$ if
      \[ ||K_L(p, R) - \min_{(p', R') \in S} K_L(p', R')|| \leq c, \]
      thus $K_L$ is within distance $c$ of the minimum complexity element of $S$.
    uses: [am-def-kolmogorov, am-comparable]
    note: >-
      $c$ is the constant chosen in the preceding sentence (am-comparable). Double
      bars as absolute value. Existence of the min is not discussed.
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 130}
    checked: {by: 'Codex (blind) + Codex (anchored re-read); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

