  - id: am-lower-bound
    audit_row: S20-R27
    locator: §5.1 lower bound
    pdf_page: 5
    book_page: 5
    label: argument in text (§5.1)
    latex: |
      The argument in this subsection will be that 1) the complexity of $\dot{\pi}$
      is close to a lower bound on any pair compatible with it and 2) degenerate
      decompositions are themselves close to this bound. The first statement follows
      because for any decomposition $(p, R)$ compatible with $\dot{\pi}$, the map
      $(p, R) \mapsto p(R) = \dot{\pi}$ will be a simple one, adding little
      complexity. And if a compatible pair $(p', R')$ can be from $\dot{\pi}$ with
      little extra complexity, then it too will have a complexity close to the
      minimal complexity of any other pair compatible with it. Therefore we will
      first produce three degenerate pairs that can be simply constructed from
      $\dot{\pi}$.
    uses: [am-compatible, am-planner, am-def-kolmogorov]
    note: >-
      Informal argument, not a numbered result. "can be from $\dot{\pi}$" (a verb,
      presumably "constructed", is missing) transcribed as printed.
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 130}
    checked: {by: 'Codex (blind); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

