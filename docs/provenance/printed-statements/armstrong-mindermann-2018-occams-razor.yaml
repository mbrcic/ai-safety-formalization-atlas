excerpts:
  - id: am-fn10
    for: [am-f-complexity, am-prop8]
    reason: >-
      Footnote 10 to the F-complexity definition; it carries a printed slip
      ($K_F$ for $K_L$ in the last term, and an unbalanced parenthesis) and is where
      the page uses $F_4 \circ F_4 = \mathrm{id}$, the step a two-sided
      comparability (Proposition 8) needs.
    pdf_page: 6
    latex: |
      $^{10}$$F$-complexity is non-negative: $F_4 \circ F_4$ is the identity, so that
      $K_L(F_4(p, R)) - K_L(p, R) =
      -(K_L(F_4(F_4(p, R)) - K_L(F_4(p, R))$, meaning that
      $\max_{(p,R),F_4} K_L(F_4(p, R)) - K_F(p, R)$ must be non-negative; this is a
      reason to include $F_4$ in the definition of $F$.
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 130}
    checked: {by: 'Codex (anchored); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

  - id: am-prop7-proof-step
    for: [am-prop7]
    reason: >-
      Shows how the proof reads "amongst the lowest complexity": it compares with
      the simplest compatible pair (assumes the minimum is attained) and uses only
      the one-sided bound from $c$-reasonableness, with the remaining two pairs
      left to "the same argument".
    pdf_page: 7
    latex: |
      Now pick $(p, R)$ to be the simplest pair compatible with $\dot{\pi}$. Since
      $L$ is $c$-reasonable for $F$, $K_L(p_{\dot{\pi}}, 0) \leq c + K_L(p, R)$.
      Hence $(p_{\dot{\pi}}, 0)$ is of lowest complexity among the pairs compatible
      with $\dot{\pi}$; the same argument applies for the other two degenerate pairs.
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 130}
    checked: {by: 'Codex (anchored); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}
