  - id: klamka-thm2
    audit_row: S25-R13
    locator: Theorem 2
    pdf_page: 2
    book_page: 726
    label: Theorem 2
    latex: |
      \emph{Theorem 2}

      If there are $i$ such that
      \[ \operatorname{int}\left[\frac{n_i + \nu_i - 1}{\nu_i}\right] > m, \]
      then the system $S$ is unobservable.

      \emph{Proof:} It follows by duality.
    uses: [klamka-intro-system, klamka-intro-notation, klamka-intro-index, klamka-def-int, klamka-def-jordan-criterion]
