  - id: klamka-cor3
    audit_row: S25-R15
    locator: Corollary 3
    pdf_page: 2
    book_page: 726
    label: Corollary 3
    latex: |
      \emph{Corollary 3:} If there are $i$ such that
      \[ \operatorname{int}\left[\frac{n_i + \nu_i - 1}{\nu_i}\right] > \max\,(r,m), \]
