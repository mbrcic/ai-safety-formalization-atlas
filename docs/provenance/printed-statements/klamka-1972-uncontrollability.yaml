    audit_row: S25-R12
    locator: Corollary 1
    pdf_page: 2
    book_page: 726
    label: Corollary 1
    latex: |
      \emph{Corollary 1:} If there are $i$ such that
      \[ \operatorname{int}\left[\frac{n_i + \nu_i - 1}{\nu_i}\right] > p, \]
