excerpts:
  - id: klamka-thm1-rank-step
    for: [klamka-thm1, klamka-thm2]
    reason: >-
      The step of the proof of Theorem 1 that turns (5) and the hypothesis into
      uncontrollability, through the imported criterion; (6) contains a printed
      slip: the rank of a product is in general only bounded above by the minimum
      of the ranks. The intended fact is that $T^{-1}$ is nonsingular, so
      $\operatorname{rank} G = \operatorname{rank} B = r$, which the printed
      chain reaches because $\min(n, r) = r$.
    pdf_page: 2
    latex: |
      Since the matrix $T$ is nonsingular, then
      \[ \operatorname{rank} G = \min\,(\operatorname{rank} T^{-1}, \operatorname{rank} B)
         = \min\,(n,r) = r. \tag{6} \]
      If there are $i$ such that
      \[ \operatorname{int}\left[\frac{n_i + \nu_i - 1}{\nu_i}\right] > r, \tag{7} \]
      then row vectors $g_{i1}, g_{i2}, \cdots, g_{i\alpha_i}$ are linearly
      dependent; therefore, system $S$ is uncontrollable. \hfill Q.E.D.
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 200}
    checked: {by: 'Codex (anchored); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}
