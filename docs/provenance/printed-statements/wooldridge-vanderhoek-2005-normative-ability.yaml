  - id: wvh05-def-permission
    audit_row: S27-R12
    locator: §5 permission, p.408
    pdf_page: 13
    book_page: 408
    label: 'Definition (permission $\mathsf{P}_\eta$), §5'
    latex: |
      \begin{itemize}
      \item $\varphi$ is said to be permissible within the context of normative system
        $\eta$ iff the grand coalition of agents can cooperate to achieve $\varphi$ within
        the context of $\eta$---that is, if there is some way that the grand coalition of
        all agents can cause $\varphi$ by behaving legally, according to the normative
        system $\eta$; and
      \end{itemize}
      This leads immediately to the following definition of permission and obligation.
      \[ \mathsf{P}_\eta\varphi \mathrel{\hat{=}} \langle\!\langle \eta : Ag \rangle\!\rangle\varphi \]
    context: |
      Introduced by: "So, our definition of obligations and permissions is as follows:"
      The display on the page is
      "$\mathsf{P}_\eta\varphi \mathrel{\hat{=}} \langle\!\langle \eta : Ag \rangle\!\rangle\varphi
      \qquad \mathsf{O}_\eta\varphi \mathrel{\hat{=}} \neg\mathsf{P}_\eta\neg\varphi$";
      the obligation half is statement wvh05-def-obligation.
    uses: [wvh05-sem-normative-ability, wvh05-def-coalition]
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 130}
