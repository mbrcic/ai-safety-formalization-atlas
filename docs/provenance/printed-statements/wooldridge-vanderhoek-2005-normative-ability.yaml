  - id: wvh05-def-non-trivial
    audit_row: S27-R09
    locator: p.405
    pdf_page: 10
    book_page: 405
    label: 'Definition (non-trivial normative system), §3.2'
    latex: |
      Let us call a normative system $\eta$ to be \emph{non-trivial} if it allows,
      everywhere, the grand coalition $Ag$ to perform an action: $\eta$ is non-trivial iff
      \[ \forall q \in Q \exists j \in J_{Ag} \forall i \in Ag\colon \quad q \notin \eta(j_i) \]
    uses: [wvh05-def-normative-system, wvh05-def-joint-action]
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 130}
