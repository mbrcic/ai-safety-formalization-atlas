  - id: wvh05-deontic-chain
    audit_row: S27-R17
    locator: p.410 chain
    pdf_page: 14-15
    book_page: 409-410
    label: 'chain of implications, §5'
    latex: |
      If something is naturally, or physically inevitable, then it is obligatory in any
      normative system; if something is an obligation within a given normative system
      $\eta$, then it is permissible in $\eta$; and if something is permissible in a given
      normative system, then it is naturally (physically) possible. Thus we have the
      following chain of implications (where $\eta$ is an arbitrary \emph{non-trivial}
      normative system).
      \[ \models (\mathsf{A}\varphi \to \mathsf{O}_\eta\varphi) \qquad
         \models (\mathsf{O}_\eta\varphi \to \mathsf{P}_\eta\varphi) \qquad
         \models (\mathsf{P}_\eta\varphi \to \mathsf{E}\varphi) \]
      Note that the second of these properties does not hold for arbitrary normative
      systems $\eta$: If $\eta = \eta_\top$ for example, we have $\mathsf{O}_\eta\varphi$
      ($= \neg\mathsf{P}_\eta\neg\varphi$) for any $\varphi$, but at the same time,
      $\mathsf{P}_\eta\psi$ for no $\psi$.
    uses: [wvh05-def-atl-ctl-quantifiers, wvh05-def-permission, wvh05-def-obligation,
           wvh05-def-non-trivial, wvh05-def-trivial-system]
    note: >-
      The lead-in sentence starts at the foot of p. 409 (PDF p. 14); the display and
      remark are on p. 410. No proof is printed. "$\models$" without a structure is not
      defined (see source.standing, Silent). The card's quote renders $\eta_\top$ as
      plain "η".
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 130}
    checked: {by: 'Codex (blind) + Codex (anchored re-read); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

