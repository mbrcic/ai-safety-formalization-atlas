  - id: wvh05-def-obligation
    audit_row: S27-R13
    locator: §5 obligation, p.408
    pdf_page: 13
    book_page: 408
    label: 'Definition (obligation $\mathsf{O}_\eta$), §5'
    latex: |
      \begin{itemize}
      \item $\varphi$ is said to be obligatory within the context of normative system
        $\eta$ iff $\varphi$ is \emph{inevitable} if the grand coalition conforms to $\eta$.
      \end{itemize}
      This leads immediately to the following definition of permission and obligation.
