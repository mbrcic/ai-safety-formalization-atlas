    latex: |
      $S, q \models \langle\!\langle \eta : C \rangle\!\rangle\varphi$ iff
      $\exists \sigma_C \in \Sigma_C^\eta$, such that
      $\forall \lambda \in \mathit{comp}(\sigma_C, q)$, we have
      $S, \lambda \mathrel{|}\!\models \varphi$.
