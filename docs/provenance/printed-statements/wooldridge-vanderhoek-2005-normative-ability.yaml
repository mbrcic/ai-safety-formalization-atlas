  - id: wvh05-prop2
    audit_row: S27-R10
    locator: Proposition 2, p.405
    pdf_page: 10
    book_page: 405
    label: 'Proposition 2, with the remark after its proof'
    latex: |
      \textbf{Proposition 2.} \emph{Let
      $S = \langle Q, q_0, Ag, Ac_1, \ldots, Ac_n, \rho, \tau, \Phi, \pi \rangle$ be an
      \textsc{aats}, and let $\eta$ and $\eta'$ be non-trivial normative systems over $S$.
      Then}:
      \[ \eta \preceq \eta' \quad\Leftrightarrow\quad \forall C \subseteq Ag\colon
         \Sigma_C^{\eta'} \subseteq \Sigma_C^\eta \]

      [\ldots] Although the $\Rightarrow$-direction of Proposition 2
      holds for arbitrary systems $\eta$ and $\eta'$, the other direction does not.
      Suppose that $\eta'$ is such that it forbids every action for every agent $i$ in a
      particular state $q$. Then, for any $C$, no strategy $\sigma_C$ exists that is
      $\eta'$-conformant, so $\Sigma_C^{\eta'} = \emptyset$. Would the
      $\Rightarrow$-direction of Proposition 2 be true, then we would have
      $\eta \preceq \eta'$ for any $\eta$, which obviously need not be the case.
    uses: [wvh05-def-aats, wvh05-def-normative-system, wvh05-def-non-trivial,
           wvh05-def-less-restrictive, wvh05-def-conformance]
    proof_pages: 10
    note: >-
      Slip in the remark: its last sentence prints "the $\Rightarrow$-direction" where
      the argument (and the remark's first sentence, which says the $\Rightarrow$-direction
      holds for arbitrary systems) requires $\Leftarrow$. Checked at 200 dpi: both arrows
      are $\Rightarrow$. The $\eta'$ in the remark is not non-trivial (it forbids every
      action at $q$). The card's quote drops every prime and the $\preceq$ symbol, so its
      displayed equivalence is unreadable.
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 130}
    checked: {by: 'Codex (blind) + Codex (anchored re-read); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

  - id: wvh05-sem-normative-ability
