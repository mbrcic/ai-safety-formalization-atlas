  - id: alf21-assumption2
    audit_row: S28-R11
    locator: Assumption 2, p.71
    pdf_page: 7
    book_page: 71
    label: Assumption 2
    latex: |
      \textbf{Assumption 2.} \emph{As the program $R$ and the state of the world $D$ are
      arbitrarily complex, $R$ must be able to simulate a universal Turing machine and $D$
      includes the set of inputs that can be executed by a universal Turing machine. In
      addition, the language of $R$ contains at least one explicit operation
      $\mathit{HarmHumans}()$ that harms humans and takes a finite time.}
    context: |
      Preceded by: "As the interacting program $R$ is a complex program with arbitrary
      data $D$ pertaining to complex interactions with humans, we advance the following
      assumption, in line with Bostrom's notion of superintelligence (Bostrom, 2014)."
      Followed by Corollary 3, "\emph{The containment problem is incomputable.}"
    uses: [alf21-def-terminology, alf21-def-harmhumans]
    note: >-
      The Atlas's VERBATIM quote omits the opening clause "As the program $R$ and the
      state of the world $D$ are arbitrarily complex,". Numbering is shared across
      results (Theorem 1, Assumption 2, Corollary 3).
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 130}
    checked: {by: 'Codex (blind); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

  - id: alf21-rice
    audit_row: S28-R13
    locator: §5 Rice, p.72
    pdf_page: 8
    book_page: 72
    label: citation of Rice's theorem, §5
    latex: |
      Another lesson from computability theory is the following: we may not even know
      when superintelligent machines have arrived, as deciding whether a machine exhibits
      intelligence is in the same realm of problems as the containment problem. This is
      a consequence of Rice's theorem (Rice, 1953), which states that, any non-trivial
      property (e.g., ``harm humans'' or ``display superintelligence'') of a Turing
      machine is undecidable. Non-trivial means some programs have that property and some
      don't.
    uses: [alf21-def-terminology]
    note: >-
      Cited, not proved. Bibliography (p. 75, PDF p. 11): "Rice, H. G. (1953). Classes of
      recursively enumerable sets and their decision problems. \emph{Transactions of the
      American Mathematical Society}, \emph{74}(2), 358--366." The paper states no
      restriction to properties of the computed function (semantic/extensional
      properties); its examples that follow (emptiness, all strings, password checker,
      equivalence) are such properties.
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 130}
    checked: {by: 'Codex (blind) + Codex (anchored re-read); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}
