  - id: tl04-lemma-8
    audit_row: S05-R08
    locator: Lemma 8
    pdf_page: 17-18
    book_page: 156-157
    label: Lemma 8
    latex: |
      \textbf{Lemma 8.} \emph{For any initial state $X$, the open-loop entropy
      reduction $\Delta H_{\mathrm{open}}$ satisfies}
      \[ \Delta H_{\mathrm{open}} \leqslant \Delta H^C_{\mathrm{open}}, \tag{38} \]
      \emph{where}
      \[ \Delta H^C_{\mathrm{open}} = \sum_{c \in \mathcal{C}} p_C(c)\,
         \Delta H^c_{\mathrm{open}} \]
      \[ = H(X) - H(X'|C)_{\mathrm{open}} \tag{39} \]
      \emph{with $\Delta H^c_{\mathrm{open}}$ defined as in Eq. (12). The equality
      is achieved if and only if $I(X'; C) = 0$.}
    uses: [tl04-def-open-loop-reduction, tl04-def-entropy]
    proof_pages: 18
    note: >-
      The statement runs from the foot of PDF p. 17 onto PDF p. 18; the source
      card's p. 17 alone truncates it before (39) and the equality clause.
      $I(X'; C)$ (final state with controller) is not defined by (4), which is
      printed for $I(X; C)$; the proof reads it as independence of $C$ and $X'$.
    transcribed: {by: Claude, date: 2026-11-14, from: page image, dpi: 200}
    checked: {by: 'Codex (blind) + Grok (blind) + Codex (anchored re-read); disagreements adjudicated on the page image (Claude)', date: 2026-11-15}

