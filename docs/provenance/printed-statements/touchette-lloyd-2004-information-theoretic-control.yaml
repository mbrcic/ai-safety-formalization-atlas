    latex: |
      \textbf{Theorem 9.} \emph{The entropy reduction achieved by a set of actuation
      subdynamics used in open-loop control is always such that}
      \[ \Delta H_{\mathrm{open}} \leqslant \max_{c \in \mathcal{C}}
         \Delta H^c_{\mathrm{open}}, \tag{42} \]
      \emph{for all $p_X(x)$. The equality can always be achieved for the
      deterministic controller $C = \hat{c}$, with $\hat{c}$ defined as in
      Eq. (37).}
