[pytest]
asyncio_default_fixture_loop_scope = function

# `lean` marks a test that shells out to `lake env lean`. Those tests skip
# themselves where `lake` is absent, which is right for a contributor without a
# toolchain and wrong for CI: the job that runs pytest installs pytest and no
# toolchain, so eleven tests silently skipped there — including every test of
# `check_intake_statements.py`, whose own header says those tests are the only
# evidence the check works. The Lean job runs `-m lean` after the build; the
# cheap job runs the rest.
markers =
    lean: needs `lake env lean`; run in the Lean CI job after the build
