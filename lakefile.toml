name = "ai-safety-formalization-atlas"
version = "0.8.0"
defaultTargets = ["AISafetyAtlas", "TauCeti"]

[leanOptions]
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

[[require]]
name = "Foundation"
git = "https://github.com/FormalizedFormalLogic/Foundation.git"
rev = "30a16ffa93d79d73ab4d02427fa00f50e039bf29"

# Shannon entropy, conditional entropy, mutual information and the
# data-processing inequalities, over a general measure. Pinned by commit rather
# than by tag: PFR is a research development, not a released library, and its
# API is not stable across revisions.
#
# This revision requires mathlib at `v4.33.0`, the same rev string this file
# pins, so the two resolve to the identical Mathlib commit and every shared
# transitive dependency already matches. See docs/guide/methodology.md for why
# the information-theoretic primitives are taken from a shared library rather
# than rebuilt: the Wolpert layer under AISafetyAtlas.Inference is unaffected
# and is not migrated.
[[require]]
name = "PFR"
git = "https://github.com/teorth/pfr.git"
rev = "7d6404b79b11b1a89dd1b6f997a10b14c208c4ed"

[[lean_lib]]
name = "AISafetyAtlas"

# Answers a finite model and names the theorem that settles it. Not a default
# target: the library must build without it, and nothing in the library imports
# it. See Main.lean for the input schema and for what the output is not.
[[lean_exe]]
name = "atlas-check"
root = "Main"

# Vendored from TauCetiProject/TauCeti (Apache-2.0), a Lean library downstream of
# Mathlib incubated by the Lean FRO and the Mathlib Initiative. Eight files: the
# Morse lemma in a Banach space and its dependency cone. Vendored rather than
# required because TauCeti pins Lean v4.34.0-rc2 on Mathlib `master`, while this
# repository pins v4.33.0 through PFR, Foundation and AddCombi; Lake resolves one
# Mathlib for the whole build, so a `require` would be a joint toolchain
# migration rather than an import.
#
# The backport is two lines, both recorded in
# docs/provenance/external-formalizations.md together with the upstream commit
# and the statement-fidelity audit. Nothing here is on the public API pin: the
# atlas consumes these through its own facades and grades none of them.
[[lean_lib]]
name = "TauCeti"
srcDir = "vendor/TauCeti"

# d-separation on finite DAGs: `Causalean.Graph.DAG.dSep`, the Bayes-Ball
# reachability it is computed by, and the active-path characterisation. Taken
# from a shared library rather than rebuilt, for the reason recorded in
# docs/guide/methodology.md and measured in
# docs/provenance/d-separation-build-or-depend.md: the closure is 2,483 lines
# with no `sorry`, and nothing in it is a statement this repository grades.
#
# Pinned to a fork, not to upstream, and pinned by commit rather than by branch.
# Upstream `Jiyuan-Tan/CausalSmith` is not on Lean's module system, and a
# `module` file cannot import a non-`module` one -- transitively, so no
# intermediate file escapes it. The fork converts exactly the four files in the
# import closure of `Graph/DSep/Separation.lean` and changes one declaration's
# visibility; §10 of the provenance note records why that one is forced. The
# conversion was offered upstream in Jiyuan-Tan/CausalSmith#14, and upstream
# landed exactly these four files on the module system, with the same forced
# visibility change, in b60f54a6 (2026-09-10); the issue is closed. That is only
# part of the work: the rest of `Causalean` is still non-`module`, and upstream
# plans to convert it. Re-pointing this `require` at an upstream commit is now
# possible and is a separate change; until it is made, the fork pin stands.
#
# Only the graph layer is consumed. `Causalean.SCM` carries arbitrary measurable
# domains where `AISafetyAtlas.Causal.SCM` is finite, so its do-calculus does not
# transfer at this repository's SCM -- see §8.3 of the provenance note.
[[require]]
name = "Causalean"
git = "https://github.com/mbrcic/CausalSmith.git"
rev = "3b83b4f69901a6d39dc4ba1cae12321d3defb331"
