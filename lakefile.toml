name = "ai-safety-formalization-atlas"
version = "0.7.0"
defaultTargets = ["AISafetyAtlas"]

[leanOptions]
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

[[require]]
name = "Foundation"
git = "https://github.com/FormalizedFormalLogic/Foundation.git"
rev = "b47cf447255addf88a5d72781d0d29641948eb6e"

[[lean_lib]]
name = "AISafetyAtlas"

# Answers a finite model and names the theorem that settles it. Not a default
# target: the library must build without it, and nothing in the library imports
# it. See Main.lean for the input schema and for what the output is not.
[[lean_exe]]
name = "atlas-check"
root = "Main"
