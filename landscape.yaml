    {
      "id": "LAND-HYPER-001",
      "name": "Trace-property and hyperproperty classes (Alpern–Schneider decomposition; Clarkson–Schneider hierarchy)",
      "kind": "LANDSCAPE",
      "survey_coverage": null,
      "related_survey_ids": [],
      "survey_coverage_note": "No Table-1 BY ID concerns hyperproperties; recorded as landscape evidence only.",
      "framework": "Rocq/Coq",
      "license": "Apache-2.0",
      "repository": "https://github.com/secure-compilation/exploring-robust-property-preservation",
      "revision": "c68187cbaba763d88cbb3509df4ca9cf49cc6338",
      "atlas_declaration": null,
      "root_import": false,
      "module": "Topology.v, TopologyTrace.v, Properties.v",
      "declaration": "decomposition_theorem (Topology.v); safety_closed, liveness_dense, decomposition_safety_dense (TopologyTrace.v); Safety, Liveness, hprop, SSC, HSafe, H2Safe, HLiv (Properties.v)",
      "reproduction": "Exact build attempted 2026-07-28 with coqorg/coq:8.9.1@sha256:8e26609c5450aa795af6917cf169a65ab3952ba666d1b0c90e6b0179314a1149 and coqorg/coq:8.20@sha256:e50d77c4c5a9aa0d76ae1b343d79c5f922da3a75054b79c5dc635895438e4674: both fail at InternalNondet.v line 8 (`From Stdlib Require Import List`) after compiling the principal topology/property files.",
      "notes": "Artifact for Abate, Blanco, Garg, Hritcu, Patrignani and Thibault, 'Journey Beyond Full Abstraction' (CSF 2019, arXiv:1807.04603). Mechanizes the Alpern-Schneider safety/liveness decomposition (safety = closed, liveness = dense, every trace property = safety intersect liveness) and the Clarkson-Schneider class hierarchy including subset-closed hyperproperties, hypersafety, 2-hypersafety, hyperliveness and relational hyperproperties. Found by manual GitHub search on 2026-07-28; it lies outside all six pinned corpora. Exact revision c68187c was tested unmodified. Coq 8.9.1, one of the README's claimed supported versions, and Coq 8.20 both compile Topology.v, TopologyTrace.v, Properties.v and most of the tree, then fail because `Stdlib.List` has no physical load-path binding. Therefore the repository-wide reproduction is FAILED, not reproduced; the principal declarations did kernel-compile before the unrelated late failure. Axiom caveat: Topology.v line 11 declares nonstandard `Axiom prop_ext : prop_extensionality`, used by decomposition_theorem. General arbitrary-k safety and the Clarkson-Schneider self-composition reduction are absent from this upstream tree; the independent axiom-audited Lean increment is LAND-HYPER-002.",
      "tags": [
        "compositionality",
        "verification"
      ]
    },
    {
      "id": "LAND-HYPER-002",
      "name": "k-safety self-composition and hyperproperty decomposition",
      "kind": "LANDSCAPE",
      "survey_coverage": null,
      "related_survey_ids": [],
      "survey_coverage_note": "Non-Table-1 hyperproperty infrastructure; no survey headline coverage.",
      "framework": "Lean",
      "license": "Apache-2.0",
      "repository": "https://github.com/mbrcic/ai-safety-formalization-atlas",
      "revision": "IN_TREE",
      "atlas_declaration": "AISafetyAtlas.Compositional.Hyperproperties.k_safety_iff_finite_self_composition",
      "root_import": true,
      "module": "AISafetyAtlas.Compositional.Hyperproperties",
      "declaration": "k_safety_iff_finite_self_composition; k_safety_iff_product_self_composition; self_composition_is_safety; isClosed_iff_hyperSafety; dense_iff_hyperLiveness; hyperSafety_of_isKSafety; hyperSafety_hyperLiveness_decomposition",
      "reproduction": "lake build AISafetyAtlas.Compositional.Hyperproperties AISafetyAtlas.Compositional.Hyperproperties.PrefixTopology AISafetyAtlas.Compositional.Hyperproperties.Product",
      "notes": "Clarkson-Schneider Theorem 2 in both presentations. The batch form uses unordered sets of at most k complete traces. The synchronized-product form k_safety_iff_product_self_composition uses the source ordered Fin k tuples, with the translation and its boundaries made explicit: toBatch is total and coalesces duplicates and order (card_toBatch_le, toBatch_perm), padding recovers a nonempty batch exactly (toBatch_padBatch), and for k greater than zero the empty batch has no product preimage at all, which productSelfComposition_empty and finiteSelfComposition_empty record. The transfer is therefore stated for the induced safety predicate rather than an arbitrary predicate, since selfCompositionSafe_empty_of_any shows the empty batch is subsumed by every other one while an arbitrary predicate could distinguish it; the product form additionally carries a nonempty-system hypothesis. The reduction proves both satisfaction equivalence and that the induced batch predicate has finite bad observations. The operational reading of the decomposition is now earned rather than asserted. PrefixTopology defines the observation topology as a function of the observation relation prefixOf, deliberately not as a global TopologicalSpace instance, since a global instance cannot mention prefixOf and would forget the observation semantics; it is installed locally with letI. Against that topology, isClosed_iff_hyperSafety and dense_iff_hyperLiveness prove that closed and dense mean exactly Clarkson-Schneider hypersafety and hyperliveness, stated independently of any topology, and hyperSafety_of_isKSafety supplies the inclusion joining the k-safety reduction to the decomposition. The generic arbitrary-topology decomposition is retained in the parent module and is no longer the operational claim. Independent Lean proof; it does not import the Rocq artifact or its prop_ext axiom.",
      "tags": [
        "compositionality",
        "verification"
      ]
    },
    {
      "id": "LAND-ANGLUIN-001",
      "name": "Port-labelled anonymous networks, views, and automorphisms",
      "kind": "LANDSCAPE",
      "survey_coverage": null,
      "related_survey_ids": [
        "BY-043"
      ],
      "survey_coverage_note": "Upstream dependency for the survey-original BY-043. Not coverage of it; no status follows from this entry.",
      "framework": "Lean",
      "license": "Apache-2.0",
      "repository": "https://github.com/mbrcic/ai-safety-formalization-atlas",
      "revision": "IN_TREE",
      "atlas_declaration": "AISafetyAtlas.Compositional.Networks.runFor_eq_of_view_eq",
      "root_import": true,
      "module": "AISafetyAtlas.Compositional.Networks",
      "declaration": "runFor_eq_of_view_eq; invariant_of_automorphism; no_unique_leader_of_fixedPointFree; invariant_of_constant",
      "reproduction": "lake build AISafetyAtlas.Compositional.Networks AISafetyAtlas.Examples.SixTargets",
      "notes": "Builds the network beneath AISafetyAtlas.Compositional.Symmetry, whose Protocol structure takes observational indistinguishability as a field. Here it is derived. runFor_eq_of_view_eq is the Angluin lemma: nodes whose views agree to depth n, meaning every port sequence of length at most n reaches equally-labelled nodes, are in the same state after n synchronous rounds, so an anonymous algorithm cannot see past the depth its messages have travelled. Automorphisms give the second route: invariant_of_automorphism shows a port-preserving permutation leaving the configuration invariant keeps it invariant through every round, and no_unique_leader_of_fixedPointFree concludes that a fixed-point-free automorphism rules out electing a unique leader, since the leader would have to be a fixed point. invariant_of_constant places the earlier constant-configuration symmetry inside this model. Deterministic and synchronous only, so Itai-Rodeh randomized symmetry breaking is out of scope. Message routing is simplified: the message received on port i is what the port-i neighbour sends on index i, rather than being routed back through the neighbour own port, which would need a port involution. The general covering and quotient machinery relating a network to its universal cover is not formalized.",
      "tags": [
        "compositionality",
        "multi-agent"
      ]
    },
    {
      "id": "LAND-RECT-001",
      "name": "Rectangle, exchange, and unary-contract equivalences",
      "kind": "LANDSCAPE",
      "survey_coverage": null,
      "related_survey_ids": [],
      "survey_coverage_note": "Compositional trace/state mathematics, not a Table-1 impossibility result.",
      "framework": "Lean",
      "license": "Apache-2.0",
      "repository": "https://github.com/mbrcic/ai-safety-formalization-atlas",
      "revision": "IN_TREE",
      "atlas_declaration": "AISafetyAtlas.Compositional.rectangle_iff_exchange_closed",
      "root_import": true,
      "module": "AISafetyAtlas.Compositional.Rectangularity",
      "declaration": "rectangle_iff_exchange_closed; coordinate_product_iff_spliceClosed; not_isCoordinateProduct_finitelySupported; coordinate_product_iff_recombination_closed",
      "reproduction": "lake build AISafetyAtlas.Compositional.Rectangularity",
      "notes": "Mechanizes the communication-complexity mix-and-match characterization for binary relations and two indexed full-product characterizations. Sources: Kushilevitz-Nisan (1997) rectangle folklore and Fagin (1977) lossless-join/MVD special case. coordinate_product_iff_spliceClosed is the substantive indexed result: over a finite index and a nonempty predicate, being the full product of unary contracts is equivalent to closure under updating one accepted point at a single coordinate, proved by splicing coordinates one at a time along a Finset.piecewise induction. coordinate_product_iff_recombination_closed is retained only as a helper and is explicitly demoted in the module docstring, since one inclusion of the product equality always holds and the statement therefore reduces to unfolding Set.pi. Necessity of finiteness is machine-checked rather than asserted: spliceClosed_finitelySupported and not_isCoordinateProduct_finitelySupported show the finite-support Boolean sequences over the naturals are splice closed with full unary projections yet omit the constantly-true sequence. Applies to single trace/state predicates, not hyperproperties.",
      "tags": [
        "compositionality"
      ]
    },
    {
      "id": "LAND-WIRE-OBJ-001",
      "name": "Ring-Orseau objective factorization",
      "kind": "LANDSCAPE",
      "survey_coverage": null,
      "related_survey_ids": [],
      "survey_coverage_note": "Supporting wireheading mathematics, not itself a Table-1 row.",
      "framework": "Lean",
      "license": "Apache-2.0",
      "repository": "https://github.com/mbrcic/ai-safety-formalization-atlas",
      "revision": "IN_TREE",
      "atlas_declaration": "AISafetyAtlas.Wireheading.AgentEquations.value_eq_of_agree_on_window",
      "root_import": true,
      "module": "AISafetyAtlas.Wireheading.Objective",
      "declaration": "AgentEquations.value_eq_of_agree_on_window; AgentEquations.truncation_exact; AgentEquations.bestAction_max; Objective.value_eq_of_agree_on_window; Objective.value_scaleUtility; Objective.optimal_decisions_eq_of_pos_scaleUtility; Objective.value_congr; Objective.optimal_decisions_congr",
      "reproduction": "lake build AISafetyAtlas.Wireheading.Objective AISafetyAtlas.Wireheading.AgentEquations",
      "notes": "The Ring and Orseau (AGI 2011) agent equations and their finite-horizon consequences. AgentEquations writes down the source displayed equations (1) to (3): value is the depth-truncated form of the mutually recursive v_t(h) and v_t(ha), bestAction and bestAction_max are the argmax of equation (1), and actionValue is equation (2). Equations (2) and (3) have no base case in the source, so the truncation is explicit rather than implicit: value_eq_zero_of_horizon_vanishes and truncation_exact show that once the horizon weighting vanishes past the window, deepening the recursion changes nothing, which is the condition under which the finite form is the source value rather than an approximation. AgentEquations.value_eq_of_agree_on_window is the factorization with content, since its proof unfolds the recursion: with the prior fixed, the depth-n value depends only on the utility and horizon inside the reachable window. The Objective module keeps the same shape at one further remove, with its own locality, homogeneity and rescaling results, and separately. The headline results unfold the horizon sum: value_eq_of_agree_on_window is the truncation statement that value on a window depends only on the weights and utilities inside it, so two objectives may diverge arbitrarily outside and still agree on it; value_scaleUtility is homogeneity in utility; optimal_decisions_eq_of_pos_scaleUtility carries that through to optimal-decision sets under strictly positive rescaling. Separately, value_congr and optimal_decisions_congr are record congruence only: their proofs conclude equality of the two objectives from componentwise equality and never unfold value, so they are well-definedness lemmas and not results about objectives. An earlier revision exposed only those two under the name objective_factorization, which overstated their content; they are renamed and demoted here. The paper frames its results as statements and arguments and supplies no numbered objective-factorization theorem, so nothing here reproduces a numbered source result. Lean utilities are unrestricted real values rather than source-bounded [0,1] values. This entry does not formalize AIXI, Solomonoff induction, delusion-box learning thresholds or asymptotic convergence.",
      "tags": [
        "agent-incentives"
      ]
    },
