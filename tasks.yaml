      "id": "CT-15",
      "title": "Formalize the survey's own three theorems (BY-042 / BY-043 / BY-044)",
      "size": "L",
      "rung": "New proof rung",
      "status": "OPEN",
      "heading_level": 3,
      "body": "The three results the survey [*Impossibility Results in AI: A Survey*](https://doi.org/10.1145/3603371)\nintroduces **itself** — listed in the results table but, unlike the imported\nresults, developed and argued by the authors in a dedicated section with proof\nsketches. BY-042 and BY-044 are `PROOF_SKETCH`, `MAPPED`, and unformalized;\nBY-043 already carries a `RELATED` formalization — check the row before\nscoping it. A sketch is a scaffold, not a full proof, so mechanizing one audits\nthe sketch. One target among many, taken on the same grounds as any other:\nwhether it makes something else easier to state or prove.\n\n- **Targets (pick one):**\n  - **BY-044 — Limited self-awareness:** an agent cannot be perfectly\n    self-aware across the survey's operational boundaries. The sketch is a\n    finite-resource / awareness-graph argument (its proposition plus a handful of\n    operational assumptions), *not* primarily a Gödel/Rice fixed-point result —\n    read it and pin the actual structure before assuming any reuse. Likely the\n    lightest of the three; take first.\n  - **BY-043 — Misaligned embodiment:** mistakenly cloned self-interested agents\n    cannot perfectly control one another. The sketch turns on operational\n    cloning, functional identity, self-interest, and competition over a scarce\n    resource — not obviously self-reference. Pin those definitions first.\n  - **BY-042 — Unfairness of explainability:** a verifier and a decision-maker\n    hold structurally unequal strategic positions when explanations omit the full\n    execution trace. Two distinct claims — verifier indistinguishability without a\n    full trace, and growing adversarial advantage as the decision-maker better\n    models surrounding actors — needing game-theoretic / information-asymmetry\n    machinery; scope the hardest, take last.\n- **Step 0 (do first, low effort):** in [`registry.yaml`](../../registry.yaml)\n  add `\"brcic-yampolskiy-2023-own-results\"` to the chosen row's\n  `original_source_refs` — the `work` record for the survey's authored section,\n  **not** `brcic-yampolskiy-2023`, which is the Table 1 directory and states no\n  theorem to grade against. `original_source_refs` must hold `source_catalog`\n  keys, never raw DOIs, or `agent_gate.sh` rejects the change. Then write a\n  provenance note under\n  [`../provenance/`](../provenance/) that pins the **exact** paper statement,\n  section/theorem number, the sketch, and every definition it assumes\n  (e.g. what \"perfectly self-aware\" or \"operational boundaries\" mean formally).\n  Pin the model before writing Lean.\n- **Acceptance:** a kernel-checked Lean theorem under the facade (new namespace as\n  needed — `AISafetyAtlas.SelfAwareness`, `.Embodiment`; `.Explainability`\n  already exists) with an honest `EXACT`/`EQUIVALENT`/`RELATED` classification\n  against the paper statement; the provenance note stating exactly which\n  assumptions are and are not mechanized and **any gap the sketch leaves**;\n  `agent_gate.sh` + `lake build` green; kernel axioms clean.\n- **Does not change:** the other two rows until each lands; no retro-claim of\n  coverage in README/registry until a proof (not a statement) is in."
    },
