  "preamble": "# Contributor Tasks\n\nBounded, ready-to-take units. Each states goal, acceptance evidence, and what it\ndoes **not** change. Use this with or without an AI coding agent.\n\nDifficulty: **S** one sitting · **M** Lean/schema · **L** design / multi-module.\n\n**Not survey-only.** Tasks below include survey pointers, but the workbench also\nneeds domain consumers, non-claims, examples, landscape leads, and new claims on\nexisting primitives. If nothing here fits, open an issue describing the gap.\n\n## Open now\n\n**Agent-friendly default:** pick an S task or a small Lean use-site; let the\nagent draft; you (or CI) run `lake build`, `scripts/agent_gate.sh`, and\n`python3 scripts/check_print_axioms.py` when theorems change. Wrong Lean is a\nred build, not a social failure. A green build is **kernel validity of the\nencoding** — not paper match, model adequacy, non-vacuous assumptions, or system\ninterpretation (see [CONTRIBUTING](../../CONTRIBUTING.md)).\n\n**Have a question rather than an answer?** Propose a conjecture — an open\nquestion stated precisely enough to be false is a deliverable here, and you do\nnot need Lean to contribute one. See\n[conjectures](conjectures.md).\n\n**Looking for a target rather than a task?** Run\n`python3 scripts/report_consumers.py --queue`. It lists every atlas declaration\nthat nothing outside `Examples/` builds on. A theorem with no downstream\nconsumer has untested ergonomics — that is the gap CT-4 closed for\n`Verification.rice` and CT-16 opened for the bounded portfolio target. Giving\none a real consumer, or arguing it should be retired, is contribution either\nway. The count is a queue, not a score.\n\nNew here, and unsure whether a task is even the right shape for what you have?\nThe README's [Get started](../../README.md#get-started) table routes that. If a\ntask is what you want: CT-11, CT-12 and CT-14 need no Lean, CT-13 is the\ntoolchain exercise. CT-1…CT-5 are completed history.",
