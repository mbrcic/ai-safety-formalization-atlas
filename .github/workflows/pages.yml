# Public project page.
#
# Ships one static directory. No Lean, no dependency walk, no build step — the
# whole job is checkout, upload, deploy, and it finishes in under a minute.
#
# REPOSITORY PREREQUISITE, one time, not settable from this file: Pages must be
# configured with **Source: GitHub Actions** under Settings -> Pages -> Build and
# deployment. Without it the build job passes, the artifact uploads, and `deploy`
# fails at "Get Pages site failed" — a message that does not name the setting it
# wants.
name: Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The page's result table deep-links into blob/main. Publishing from any
    # other ref would ship a page whose links 404 until that ref merges, so a
    # manual dispatch from a feature branch is refused rather than half-served.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
