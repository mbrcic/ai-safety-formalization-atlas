name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # weekly Mon 06:00 UTC — catch Mathlib CDN / toolchain drift
    - cron: '15 3 * * *'  # nightly 03:15 UTC — leanchecker, on the self-hosted runner
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Schema, generated views, and path checks — always (docs-only PRs stay cheap).
  agent-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # check_migration_adjudicated.py reads lean-toolchain at the recorded
          # baseline commit to decide whether this branch is a toolchain bump.
          # A depth-1 checkout does not have that commit, and a check that
          # cannot see its baseline would skip exactly when it is needed.
          fetch-depth: 0
      # The gate skips tests/ when pytest is absent so a contributor without it
      # still gets every other check. CI installs it, so the skip never applies
      # here and the shape suite is not optional on a pull request. PyYAML is
      # here because check_conjecture_grade_prose.py is the one agent_gate
      # script that reads conjectures.yaml through the real parser rather than
      # the hand-rolled one the ledger validators use.
      - name: Install pytest, ty, and PyYAML (shape suite + type check + prose gate)
        run: |
          set -euo pipefail
          ci_venv="$RUNNER_TEMP/atlas-agent-gate-venv"
          python3 -m venv "$ci_venv"
          "$ci_venv/bin/python" -m pip install --quiet pytest ty pyyaml
          # Keep pytest, ty, and the interpreter used by agent_gate in one
          # environment.  Installing with a different pip than the executable
          # used by ty can make CI report a false unresolved-import failure.
          echo "VIRTUAL_ENV=$ci_venv" >> "$GITHUB_ENV"
          echo "$ci_venv/bin" >> "$GITHUB_PATH"
      - name: Cheap agent gate
        run: ./scripts/agent_gate.sh
      # Onboarding contract: setup.sh must parse, document itself, reject bad
      # options, and run the docs-only (--pointer) path. This job is unfiltered,
      # so a PR that breaks the onboarding script can no longer stay green.
      - name: Smoke-test onboarding (setup.sh contract)
        run: |
          set -euo pipefail
          bash -n scripts/setup.sh
          scripts/setup.sh --help >/dev/null
          if scripts/setup.sh --bogus >/dev/null 2>&1; then
            echo "setup.sh accepted an unknown option — expected non-zero exit" >&2
            exit 1
          fi
          scripts/setup.sh --pointer

  # Lean build + axioms only when Lean toolchain or sources change.
  lean:
    needs: agent-gate
    # Ordinary runs stay on the shared ubuntu-latest pool. Release tags, manual
    # runs, and the nightly leanchecker cron move to the self-hosted runner
    # (labels: self-hosted, leanchecker): leanchecker's cost tracks a module's
    # import closure, and the worst single module needs more memory than a
    # GitHub-hosted runner provides. See the leanchecker step below.
    runs-on: >-
      ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') ||
           github.event.schedule == '15 3 * * *')
          && fromJSON('["self-hosted", "leanchecker"]') || 'ubuntu-latest' }}
    # 30 minutes for ordinary runs, so a hung PR build is caught quickly. Only
    # release tags, manual runs, and the nightly leanchecker cron get the
    # longer budget, and they get it because the leanchecker replay below
    # needs it -- see that step.
    timeout-minutes: >-
      ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') ||
           github.event.schedule == '15 3 * * *')
          && 75 || 30 }}
    outputs:
      run_lean: ${{ steps.filter.outputs.run_lean }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decide whether Lean build is required
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          pattern='(\.lean$|^lakefile\.toml$|^lake-manifest\.json$|^lean-toolchain$|^scripts/lean_build_targets\.txt$|^scripts/check_print_axioms\.py$|^scripts/generate_declaration_index\.py$|^scripts/check_cited_declarations\.py$|^docs/status/declaration-index\.json$|^scripts/agent_gate\.sh$|^\.github/workflows/ci\.yml$)'
          run_lean=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            run_lean=true
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Release tag: full Lean verification.
            run_lean=true
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Verify the post-merge tree too. This deliberately does not rely on
            # branch-protection configuration remaining correct forever.
            run_lean=true
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            if git diff --name-only "$base" "$head" | grep -E "$pattern" >/dev/null; then
              run_lean=true
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              if git diff --name-only "$before" "${{ github.sha }}" | grep -E "$pattern" >/dev/null; then
                run_lean=true
              fi
            else
              run_lean=true
            fi
          fi
          echo "run_lean=$run_lean" >> "$GITHUB_OUTPUT"
          echo "Lean build required: $run_lean"
      - name: Skip notice
        if: steps.filter.outputs.run_lean != 'true'
        run: echo "No Lean-related paths changed; skipping lake build and axiom check."
      # Cache only Foundation (full Gödel I/II, source-built — not in the Mathlib
      # CDN cache). Mathlib and its deps come from `lake exe cache get` each run,
      # so we never tar/restore gigabytes of Mathlib oleans. Keyed on the
      # toolchain + manifest; the prefix restore-key reuses a prior Foundation
      # build across manifest bumps (lake revalidates traces).
      - name: Cache Foundation build (skip cold Gödel rebuild)
        if: steps.filter.outputs.run_lean == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages/Foundation
          key: foundation-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            foundation-${{ runner.os }}-${{ runner.arch }}-
      # Cache only the atlas library's OWN build output (MB). Mathlib/Foundation
      # oleans live under .lake/packages and are never tarred here, so no 10 GB
      # repo-cache-cap risk. Lake revalidates traces, so a prefix-restored stale
      # olean set just triggers targeted rebuilds — this makes the atlas compile
      # incremental as the tree grows instead of cold every run.
      - name: Cache atlas oleans (incremental atlas compile; Mathlib excluded)
        if: steps.filter.outputs.run_lean == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: atlas-olean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json', 'AISafetyAtlas/**/*.lean') }}
          restore-keys: |
            atlas-olean-${{ runner.os }}-${{ runner.arch }}-
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        if: steps.filter.outputs.run_lean == 'true'
        with:
          # Mathlib oleans via CDN (fast); do not GitHub-cache the whole .lake
          # (multi-GB, slow tar, risks the 10 GB repo cache cap → evictions).
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Compile explicit non-root Lean targets
        if: steps.filter.outputs.run_lean == 'true'
        run: xargs lake build < scripts/lean_build_targets.txt
      - name: Kernel axiom check for headline declarations
        if: steps.filter.outputs.run_lean == 'true'
        run: python3 scripts/check_print_axioms.py
      # The step above decides *what* to audit with two regexes over source
      # text, and nothing checked that they reach what they claim to. They did
      # not: `PUBLIC_THEOREM_RE` rejected a leading attribute, so every
      # `@[simp] public theorem` -- 51 of them -- was collected by nothing and
      # never passed to `#print axioms`. The count stayed plausible and the
      # v4.33.0 migration's name-for-name comparison stayed green, because both
      # sides were computed by the same regex and shared the hole.
      #
      # This step reaches the same surface by a different route: it walks the
      # elaborated environment, drops what the compiler generated, and checks
      # the axioms of everything else with `Lean.collectAxioms`. So it is both
      # an independent second implementation of the audit and the thing that
      # keeps the first one honest.
      - name: Axiom audit reaches the whole public surface
        if: steps.filter.outputs.run_lean == 'true'
        run: python3 scripts/check_audit_coverage.py
      # A third implementation of the same question, and the only one this
      # repository did not write. `axiom-audit` has been in lake-manifest.json
      # the whole time -- inherited through Foundation's lakefile -- and was
      # referenced by nothing here, so two hand-rolled scanners were carrying a
      # check an upstream tool already performs.
      #
      # `--modules-from` is not optional. The atlas root does not transitively
      # import the whole library (that is what scripts/lean_build_targets.txt
      # exists for), and auditing by root import reaches 5957 declarations
      # against 9439 for the module sweep -- 3482 of them off-root, which is
      # where the awkward material lives. Auditing the root alone would have
      # looked like the broadest check here while being the narrowest.
      - name: Axiom audit (upstream tool, independent of our scanners)
        if: steps.filter.outputs.run_lean == 'true'
        run: lake exe axiom-audit --root AISafetyAtlas --modules-from AISafetyAtlas
      # `check_elaboration_drift.py --classify` sorts all 171 declarations whose
      # elaborated type changed while their printed type did not into eleven
      # substitution classes. That accounting is mechanical, but whether a class
      # preserves meaning is a human verdict, and failure inside a class is
      # correlated: if the `Monoid.toPow` verdict is wrong, all 75 declarations
      # under it are wrong together. The file below states each class as a
      # definitional equality the kernel settles, turning those verdicts into
      # obligations it can check.
      #
      # Ungated: about four seconds against a Mathlib the steps above have already
      # built. Expect it to go red eventually -- it fails when a later toolchain
      # breaks an equality one of the adjudications rests on, which is the drift
      # nothing else here can see. Re-adjudicate the class; do not delete the
      # anchor.
      - name: Elaboration-drift adjudications still hold at the pinned toolchain
        if: steps.filter.outputs.run_lean == 'true'
        run: lake env lean docs/provenance/elaboration-adjudication-v4310-v4330.lean
      # The adjudications above settle the migration that has already happened.
      # This settles the one nobody has declared: every check in this repository
      # that could notice a statement changing meaning reads source, and the
      # dangerous change is the one where the source does not move. An upstream
      # rename behind an alias, a different instance chosen, a definition made
      # reducible -- the text is identical, the build is green, the axiom audit
      # still says proved, of something else. A Mathlib rebuild against a moved
      # CDN artifact produces exactly this and nothing else here would see it.
      #
      # So: elaborate this tree, hold it to the recorded v4.33.0 baseline, and
      # fail on the one bucket an ordinary branch can be held to. `--fatal
      # silent` is the whole reason this is gateable. Adding, removing or
      # visibly editing a statement is what a branch is for and would make a
      # plain --compare red on every ordinary PR, which is why it was left
      # unwired; but a declaration whose printed type is unchanged cannot have
      # changed meaning through an edit, so a silent change is never work
      # anyone asked for.
      #
      # Expect it to go red on a toolchain bump. That is correct and is the
      # point: re-adjudicate the silent set, re-dump the baseline, and record
      # the classes. Do not widen the flag.
      #
      # Cost: the dump elaborates the whole environment, measured at 342 s and
      # 2.2 GB on an idle 12-core host against a tree the steps above have
      # already built; a two-core hosted runner is slower. That is the largest
      # single step on an ordinary pull request, so read it against this job's
      # 30-minute budget before adding anything else here.
      - name: No statement changed meaning behind an unchanged printed type
        if: steps.filter.outputs.run_lean == 'true'
        run: |
          set -euo pipefail
          dump="$RUNNER_TEMP/elab-current.json"
          python3 scripts/check_elaboration_drift.py --dump "$dump" --raw
          python3 scripts/check_elaboration_drift.py \
            --compare docs/status/elab-baseline-v4330.json "$dump" --fatal silent
      # Independent kernel re-verification, strictly stronger than the axiom
      # check above: that one asks which axioms a declaration depends on, this
      # one replays every declaration the atlas compiled through the kernel and
      # asks whether it typechecks at all. It is what catches an environment
      # built by metaprogramming rather than by proving -- a failure mode
      # `#print axioms` cannot see, because a hacked environment reports
      # whatever axioms it likes.
      #
      # `leanchecker` ships with the toolchain (Lean >= v4.28.0); the separate
      # leanprover/lean4checker repository is archived and must not be cloned.
      #
      # Scope is the atlas's own modules. Their oleans are exactly the ones
      # under .lake/build/lib/lean -- Mathlib, Foundation and PFR build into
      # .lake/packages -- so imports are trusted and only what this repository
      # declares gets replayed. Passing no module argument would instead walk
      # every olean on the search path, Lean core included.
      #
      # RELEASE TAGS, MANUAL RUNS, AND THE NIGHTLY CRON -- never on a pull
      # request, a push to main, or the weekly drift schedule. The replay takes
      # tens of minutes against 4 s for a no-op build and ~40 s for the axiom
      # check, so wiring it into every PR would stall development regardless of
      # runner.
      #
      # The nightly cron is what keeps it honest. Release tags are rare enough
      # that gating on them alone leaves the step effectively unrun, and an
      # unrun check is one that breaks silently and is discovered at the worst
      # moment.
      - name: Independent kernel re-verification (leanchecker)
        # 90 minutes, not 45: one process per module is what keeps peak memory
        # bounded, and it costs wall clock -- 239 modules in 1961 s. Passing
        # every module to one `leanchecker` instead pays the union of their
        # import closures and is OOM-killed, as is every 24-module chunk. The
        # script reports its own peak on every run; see
        # docs/provenance/toolchain-v4330-migration.md for the measured figures.
        timeout-minutes: 90
        if: >-
          steps.filter.outputs.run_lean == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           startsWith(github.ref, 'refs/tags/v') ||
           github.event.schedule == '15 3 * * *')
        run: bash scripts/kernel_replay.sh
      # The reuse report is the atlas's own primitives criterion as a number,
      # and it is what `docs/agent/INDEX.md` sends an agent to when it wants to
      # know what depends on a declaration. It used to take minutes -- a regex
      # search per (declaration, module) pair -- and was gated to scheduled runs
      # for that reason. Since it indexes each module once instead it runs in
      # about two seconds, so every Lean run can afford to check it and a stale
      # committed report is caught on the pull request that causes it.
      - name: Reuse report is current (docs/status/consumers.json)
        if: steps.filter.outputs.run_lean == 'true'
        run: |
          set -euo pipefail
          python3 scripts/report_consumers.py --json docs/status/consumers.json
          git diff --exit-code --stat -- docs/status/consumers.json
          git diff --exit-code -- docs/status/consumers.json

      # Timed separately from the assertions below, because this build dominates
      # the Lean job's wall clock -- far more than the model checks it feeds --
      # and the two costs are indistinguishable when they run as one step.
      # Timing it alone says whether the cost is elaboration or the link of a
      # large Mathlib-inclusive binary.
      - name: Build atlas-check (timed separately -- see comment)
        if: steps.filter.outputs.run_lean == 'true'
        run: |
          set -euo pipefail
          start=$(date +%s)
          lake build atlas-check
          echo "atlas-check build: $(( $(date +%s) - start ))s"
      - name: atlas-check agrees with the Lean proofs
        if: steps.filter.outputs.run_lean == 'true'
        run: ./scripts/check_atlas_check.sh
      - name: Declaration dependency views are current
        # The cheap gate can only check that these views name live declarations;
        # detecting a view that is missing new ones needs an elaborated
        # environment, which exists here and nowhere earlier.
        if: steps.filter.outputs.run_lean == 'true'
        run: |
          python3 scripts/generate_dependency_graph.py --write
          git diff --exit-code --stat -- 'docs/status/*-dependency-graph.md' \
            'docs/status/*-dependency-graph.json'
          git diff --exit-code -- 'docs/status/*-dependency-graph.md' \
            'docs/status/*-dependency-graph.json'
      - name: Declaration index is current
        # `check_cited_declarations.py` runs in the cheap gate and answers from
        # this file, so a stale index makes that check answer about a tree that
        # no longer exists -- passing over a name deleted since the last build,
        # or failing on one added since. Nothing before this step can notice,
        # because the index is produced by `lake env lean` and everything under
        # `AISafetyAtlas/Conjectures` is off the root import, so even a green
        # root build does not refresh it. This exact staleness occurred on
        # 2026-08-23: the index reported no change while forty declarations were
        # missing from it, and the generated file was the one answering.
        if: steps.filter.outputs.run_lean == 'true'
        run: |
          python3 scripts/generate_declaration_index.py --write
          git diff --exit-code --stat -- docs/status/declaration-index.json
          git diff --exit-code -- docs/status/declaration-index.json
      - name: Cited declarations resolve against the rebuilt index
        # Re-run the citation check against the index this job just regenerated,
        # rather than the one the cheap gate read from the commit.
        if: steps.filter.outputs.run_lean == 'true'
        run: python3 scripts/check_cited_declarations.py
