      "notes": "Source comparison done against the published Physica A text (survey-ref-027); its Theorems 1-11 are numbered identically to the arXiv v2 preprint originally used, and Theorems 2, 3, 4 and 10 match statement for statement. The arXiv TeX source was also read, which settles Corollary 7 as I(X;C,Z) = I(X;C) with a comma and confirms equation (28)'s second displayed line. Recorded in docs/provenance/touchette-lloyd-control.md. The equation (28) representation gap is closed for finite alphabets: kernelMinControlLoss declares the all-kernel object, minControlLoss_inputPolicies_eq_kernelMin identifies it with the realized infimum, and minControlLoss_inputPolicies_attained exhibits a deterministic minimizing policy. Theorem 2's equality case is therefore unconditional at print scope. The actuation-model gap is closed. Section 2 of the published text states purification for ANY non-deterministic channel, before Section 3 and long before the open-loop section, with condition (i) determinism given (c,z) and condition (ii) equation (7); the earlier note claiming the source confines purification to Theorem 2 was wrong and is withdrawn. AISafetyAtlas.Control.Purification proves the assertion the paper only makes: isPurification_purifyMap builds the seed as a random element of the finite space of deterministic channels S x K -> T. Theorem 9 and the step-(50) row are therefore Yes at print scope, via kernelEntropyReduction_le_iSup_kernelOpenLoop and exists_kernelEntropyReduction_dirac_eq_iSup. Equation (48)'s maximum is now proved attained by isGreatest_kernelOpenLoopMax, using the identification of probability measures on a finite state space with points of the standard simplex, linearity of the outcome law in those coordinates, and compactness; exists_kernelEntropyReduction_le_at_max states Theorem 10 against the realized maximum. Theorem 10 is therefore Yes and this source has no Partial rows left. entropyReduction_le_of_openLoopBound remains useful because its conditional-ensemble hypothesis is incomparable with this rendering. Theorem 9's attainment clause is now explicit in exists_entropyReduction_const_eq_iSup_openLoopReduction. Set.univ is not equation (28)'s feasible family: a bare map may read and cancel actuation noise, as Examples.Control.minControlLoss_univ_lt_inputPolicy and not_isInputPolicy_noiseReader show. Lemma 8, Theorems 5, 6, 9 and 10's inequality at kernel scope, and Corollary 7 are proved; Theorems 1 and 11 remain unformalized, as does the source's unproved prose claim L_S <= H(Z_B).",
