      "notes": "Cover and Thomas, Elements of Information Theory (2nd ed.), section 2.8. mutualInfo_le_of_isMarkovChain is Theorem 2.8.1 by the printed argument, two expansions of I(X ; Y, Z). Two statements the chapter asserts inside that proof but does not prove are proved here: mutualInfo_eq_iff_isMarkovChain is the equality case, and mutualInfo_le_of_isMarkovChain' is the dual the text leaves to the reader. isMarkovChain_comp is wider than the printed corollary, taking any measurable g rather than a named function. Markov chains are *defined* as CondIndepFun, which is (2.118)'s right-hand side where the book starts from the factorization (2.117). isMarkovChain_iff_measure_factorizes proves the two equivalent, so the choice of definition is no longer a convention the section trades on. Both directions run at the printed strength. Forward, measure_factorizes_of_isMarkovChain gives p(y)*p(x,y,z) = p(x,y)*p(y,z) at the printed point masses and in fact at every measurable s, t. Backward, isMarkovChain_iff_measure_factorizes_singleton takes the hypothesis at point masses alone, carried up to measurable sets by measure_preimage_inter_eq_tsum - a measurable slice of a countable-valued variable splits over its point masses - applied once in X and once in Z. The set-level isMarkovChain_iff_measure_factorizes is the wider conclusion and needs only Y measurable, with no countability or measurable singletons on S and U. Both printed conditioning counterexamples are in AISafetyAtlas.Examples.InformationTheory.DataProcessing: the chapter's integer sum at half a bit, and an XOR pair at a full bit.",
