      "id": "LAND-KNOW-001",
      "name": "Exact knowability: the observation-factorization kernel",
      "tags": [
        "information-theory",
        "interpretability"
      ],
      "result_shape": "CHARACTERIZATION",
      "notes": "Generic exact knowability interface. Knowable is defined in decoder form — one rule on observations, uniform in the state — so that the factorization/no-collision characterization stays a theorem rather than definitional unfolding; the same commitment JointObservation.Covers makes, for the same reason. knowable_iff_factorsThrough bridges to Mathlib's Function.FactorsThrough, which supplies the fibrewise construction and the [Nonempty Y] hypothesis; knowable_iff_no_collision is the binder-normalized restatement. IndistinguishabilityWitness is the negative certificate; exists_witness_of_not_knowable is its classical converse. Determines orders observations by informativeness, Knowable.mono transfers knowability upward along it, and not_knowable_comp is the constructive repair boundary — post-processing an unchanged observation cannot create knowability. The factorization content is standard and is Mathlib's; what is packaged here is the decoder-form statement, the witness interface, and monotonicity. No embedded-observer model, no temporal claim, no impossibility claim, and no consciousness result: observation is an arbitrary map, not a projection of a state containing the observer.",
