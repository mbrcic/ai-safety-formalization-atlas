 online adversarial NFL with no atlas analogue. The blocker is licensing: no license file, so nothing here is reusable, vendorable or promotable however good the proofs are. Version skew against atlas pins (Lean v4.31.0, Mathlib fabf563a) is secondary. Found via an incidental control query, not a systematic lead sweep of this row."
