    "breuer-1995-self-measurement": {
      "citation": "T. Breuer, “The Impossibility of Accurate State Self-Measurements,” Philosophy of Science, vol. 62, no. 2, pp. 197–214, Jun. 1995.",
      "locator": "https://philpapers.org/rec/BRETIO-3",
      "role": "work",
      "retrieved": "2026-08-11",
      "notes": "An observer cannot distinguish all present states of a system in which it is contained — classical or quantum, deterministic or stochastic time evolution. The primary PDF was read on 2026-08-11: §3.2 defines the inference map and exact measurement, §3.3 defines the restriction/proper-inclusion setup, §3.5 gives the meshing condition, and Propositions 1–2 state the abstract no-go results. Exactly one in-tree artifact is graded against this paper: LAND-SELFMEAS-002, the faithful abstract set-theoretic core, at RELATED rather than EXACT because physical apparatus construction, dynamics, the quantum treatment, and the EPR corollary are omitted. LAND-SELFMEAS-001 is a generic knowability specialization that is deliberately UNGRADED and carries no original_source_refs: it replaces the restriction map, inference map and meshing conditions with a product decomposition chosen to make a statement, so there is no second statement for a grade to be a grade of. PDF locator: https://cqi.inf.usi.ch/qic/Breuer95.pdf; catalogue locator remains the PhilPapers record. Search on 2026-08-11 across Mathlib, Isabelle/AFP, Rocq/Coq, HOL4, HOL Light, Agda and the general web found no machine-checked formalization; an unsuccessful search is not proof that none exists. Evidence: docs/provenance/self-measurement-kernel.md."
    },
    "chandy-lamport-1985": {
      "citation": "K. M. Chandy and L. Lamport, “Distributed Snapshots: Determining Global States of Distributed Systems,” ACM Transactions on Computer Systems, vol. 3, no. 1, pp. 63–75, Feb. 1985, doi: 10.1145/214451.214456.",
      "locator": "https://doi.org/10.1145/214451.214456",
      "role": "work",
      "retrieved": "2026-08-11",
      "notes": "A possibility result, catalogued as the escape boundary dual to the self-knowledge impossibility statements: a process can determine a consistent global state of a distributed system while the computation continues. It bounds how any embedded self-knowledge claim may be worded — the obstruction concerns exact knowledge of the present state, not knowledge of a consistent past cut. Machine-checked in Isabelle/HOL as AFP entry Chandy_Lamport (Fiedler and Traytel, July 2020, BSD License), whose session parent Ordered_Resolution_Prover pulls Coinductive and Nested_Multisets_Ordinals, so reproduction uses the full pinned AFP release rather than a single-entry archive."
    },
    "brandenburger-keisler-2006": {
      "citation": "A. Brandenburger and H. J. Keisler, “An Impossibility Theorem on Beliefs in Games,” Studia Logica, vol. 84, no. 2, pp. 211–240, Nov. 2006, doi: 10.1007/s11225-006-9011-z.",
      "locator": "https://doi.org/10.1007/s11225-006-9011-z",
      "role": "work",
      "retrieved": "2026-08-11",
      "notes": "Interactive diagonalization: a belief model of a certain kind must have a hole, so some belief a player can hold about the game is absent from any model available to the players themselves. Catalogued as the interactive-self-reference member of the diagonal family alongside CLM-LAWVERE-001. No proof-assistant formalization found on 2026-08-11; the formalizations located are mathematical and category-theoretic rather than machine-checked. Evidence: docs/provenance/embedded-self-knowledge-landscape.md."
    },
    "abramsky-zvesper-2010-lawvere-bk": {
      "citation": "S. Abramsky and J. Zvesper, “From Lawvere to Brandenburger-Keisler: interactive forms of diagonalization and self-reference,” arXiv:1006.0992, Jun. 2010.",
      "locator": "https://arxiv.org/abs/1006.0992",
      "role": "work",
      "retrieved": "2026-08-11",
      "notes": "Recasts Brandenburger–Keisler as a fixed-point argument in regular categories, reducing it to a relational form of Lawvere's one-agent diagonal argument. Catalogued because it is the stated bridge between CLM-LAWVERE-CCC-001 and brandenburger-keisler-2006, and because it separates the type-level Lawvere statement the atlas holds from the relational one the interactive cases need. It does not follow that regular-category machinery is required to formalize them: section 5.2 reformulates weak and very weak point surjectivity relationally, and the section 7 composition analysis is conducted concretely over relations on sets. No proof-assistant formalization found on 2026-08-11."
    },
