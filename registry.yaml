      "notes": "Mechanizes the communication-complexity mix-and-match characterization for binary relations and two indexed full-product characterizations. Sources: Kushilevitz-Nisan (1997) rectangle folklore and Fagin (1977) lossless-join/MVD special case. coordinate_product_iff_spliceClosed is the substantive indexed result: over a finite index and a nonempty predicate, being the full product of unary contracts is equivalent to closure under updating one accepted point at a single coordinate, proved by splicing coordinates one at a time along a Finset.piecewise induction. coordinate_product_iff_recombination_closed is retained only as a helper and is explicitly demoted in the module docstring, since one inclusion of the product equality always holds and the statement therefore reduces to unfolding Set.pi. Necessity of finiteness is machine-checked rather than asserted: spliceClosed_finitelySupported and not_isCoordinateProduct_finitelySupported show the finite-support Boolean sequences over the naturals are splice closed with full unary projections yet omit the constantly-true sequence. Applies to single trace/state predicates, not hyperproperties. Compositional trace/state mathematics, not a Table-1 impossibility result.",
