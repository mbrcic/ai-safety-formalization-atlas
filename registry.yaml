      "id": "LAND-FANO-001",
      "name": "Fano's inequality at both printed constants, and its sharpness",
      "tags": [
        "information-theory"
      ],
      "notes": "Cover and Thomas, Elements of Information Theory (2nd ed.), section 2.10, mechanized against the printed statement. fano_of_log_le is the master form: it takes any uniform bound L on log |A \\ {X' w}| and concludes H[X | X'] <= P(err) * L + binEntropy(P(err)). Both printed constants are corollaries of that one lemma — fano at the sharp log(|A| - 1) of (2.140), fano_unrestricted at the log |A| of (2.139) — where the chapter argues them separately. fano_of_embedding carries the estimate into a different type through an injection, which the printed statement does not do; the printed corollary for an estimator X-hat : Y -> X is fano_of_estimator_chain in the examples. entropy_le_fano is the no-observation remark with its sharp -1. Sharpness is entropy_eq_fano_of_witness in AISafetyAtlas.Examples.InformationTheory.Fano, which attains equality at every p in [0,1] rather than at a single point, matching the one-parameter family the chapter prints. Alphabet membership is a pointwise hypothesis (forall w, X w in A), which is what the printed typing gives; an almost-everywhere version would exceed print and is not claimed. Coverage and scope are graded row by row in docs/provenance/source-coverage-audit.md.",
