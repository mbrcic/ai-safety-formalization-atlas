          "content_source_note": "CT-10. The closed-under-permutation characterization, both directions: aggregate performance is schedule-independent iff the weighting of objectives is invariant under permutations of the search domain. The printed condition is that the weight is constant on each basis class, and by their Lemma 1 a basis class is the permutation orbit, so it is the same condition as PermInvariant. The published 2004 JMMA paper has been read. Its Theorem 5, 'non-uniform sharpened NFL', confirms the assessment recorded here: the condition is that the weight is constant on each basis class, its Lemma 1(2) identifies a basis class with a permutation orbit, and the conclusion is quantified over any two non-repeating black-box (hence adaptive) algorithms, any k, any performance measure, AND any m in {1,...,|X|}. Schumacher-Vose-Whitley 2001 has also been read; its sharpened NFL is 'a No Free Lunch result holds over F iff F is closed under permutation', over the same adaptive algorithm class, and its NFL4 explicitly notes that weighted overall measures are not generally subject to NFL except under equal weighting.",
