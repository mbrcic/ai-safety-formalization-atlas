    {
      "id": "LAND-WIRE-OBJ-001",
      "name": "Ring-Orseau objective factorization",
      "tags": [
        "agent-incentives"
      ],
      "notes": "The Ring and Orseau (AGI 2011) agent equations and their finite-horizon consequences. AgentEquations writes down the source displayed equations (1) to (3): value is the depth-truncated form of the mutually recursive v_t(h) and v_t(ha), bestAction and bestAction_max are the argmax of equation (1), and actionValue is equation (2). Equations (2) and (3) have no base case in the source, so the truncation is explicit rather than implicit: value_eq_zero_of_horizon_vanishes and truncation_exact show that once the horizon weighting vanishes past the window, deepening the recursion changes nothing, which is the condition under which the finite form is the source value rather than an approximation. AgentEquations.value_eq_of_agree_on_window is the factorization with content, since its proof unfolds the recursion: with the prior fixed, the depth-n value depends only on the utility and horizon inside the reachable window. The Objective module keeps the same shape at one further remove, with its own locality, homogeneity and rescaling results, and separately. The headline results unfold the horizon sum: value_eq_of_agree_on_window is the truncation statement that value on a window depends only on the weights and utilities inside it, so two objectives may diverge arbitrarily outside and still agree on it; value_scaleUtility is homogeneity in utility; optimal_decisions_eq_of_pos_scaleUtility carries that through to optimal-decision sets under strictly positive rescaling. Separately, value_congr and optimal_decisions_congr are record congruence only: their proofs conclude equality of the two objectives from componentwise equality and never unfold value, so they are well-definedness lemmas and not results about objectives. An earlier revision exposed only those two under the name objective_factorization, which overstated their content; they are renamed and demoted here. The paper frames its results as statements and arguments and supplies no numbered objective-factorization theorem, so nothing here reproduces a numbered source result. Lean utilities are unrestricted real values rather than source-bounded [0,1] values. This entry does not formalize AIXI, Solomonoff induction, delusion-box learning thresholds or asymptotic convergence. Supporting wireheading mathematics, not itself a Table-1 row.",
