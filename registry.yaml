      "result_shape": "BOUND",
      "notes": "Extends LAND-AMBIG-001 from one target to a window of them. Widening a window never reduces ambiguity and never exceeds the product of its steps, which brackets accumulation between never decreases and at most multiplies; one unknowable step makes the whole window unknowable. A second axis runs the other way: under Temporal.EvidenceMonotone a later reading determines an earlier one, so reading late lowers ambiguity while widening raises it, and the two compose. That is what makes the dependency on LAND-TEMPORAL-001 real rather than conceptual. Growth itself is deliberately not proved — it depends on whether each step adds a distinction the observation cannot see, which needs dynamics this layer does not have. AISafetyAtlas.Examples.Knowledge.Accumulation exhibits both extremes, a blind observer meeting the product ceiling and an informed one that never accumulates, so neither is mistaken for a law. Scope: the target is fixed while evidence accumulates; a target that moves with time is not covered. Finite counting only, with no probability, entropy or rate.",
