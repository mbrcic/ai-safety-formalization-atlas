    },
    "mais-open-problems-2026": {
      "citation": "Math for AI Safety (MAIS), master list of open problems — 92 numbered problems (MAIS-O1 … MAIS-O92), each with an AI-safety motivation, mathematical area, and difficulty rating, linked to a research agenda carrying full context.",
