      "notes": "Quantitative refinement of LAND-KNOW-001 on finite state spaces. ambiguity r f i counts the distinct target values still possible once the observation reads i; 1 is exact knowledge, 0 marks an observation value nothing realizes, and larger is the shortfall. The exactness condition is at most one rather than exactly one, because requiring equality would make every model with an unreachable observation value unknowable. knowable_iff_ambiguity_le_one is recorded and labelled a BRIDGE, not a result: it is knowable_iff_no_collision in counting form, and a module stopping there would be a cardinality wrapper around a theorem the kernel already proves. The content is the two bounds. card_image_le_of_knowable says a knowable target needs an observation with at least as many distinct outcomes as the target has values — a counting obstruction that never names a colliding pair, with not_knowable_of_card_lt as the usable contrapositive. ambiguity_le_of_comp says post-processing never decreases ambiguity anywhere, which upgrades not_knowable_comp from 'the yes/no answer cannot be repaired' to 'the shortfall never shrinks'. AISafetyAtlas.Examples.Knowledge.Ambiguity keeps the bounds honest with three models: the counting test firing where no pair is exhibited; a model where both cardinalities are 2 and the target is still unknowable, so the counting test is sufficient and never necessary; and a strict increase of ambiguity under coarsening, so the monotonicity bound is not an equality in disguise. Every declaration here is classical, inherited from Mathlib's Finset and Fintype development rather than from the statements, which differs from the axiom-free kernel core and is recorded in the module. Explicit non-claims: this counts possibilities and does not weigh them. There is no probability, entropy, rate or measure. A conditional-entropy treatment would need Shannon entropy over general probability spaces, which the pinned Mathlib does not carry — it has topological entropy, binary entropy and Kullback-Leibler divergence, and no conditional Shannon entropy — so that is a separate foundation, not an extension of this module. worstAmbiguity condenses the per-value counts into one scalar per observation, which is what a consumer comparing two observations needs, and worstAmbiguity_le_of_comp carries the coarsening bound to that scalar. No AI-system reading follows without a separate reviewed bridge.",
