      "role": "directory",
      "retrieved": "2026-08-07",
      "notes": "Problems are open to the registry's knowledge, literature-checked at release; MAIS-O60 was resolved in the negative in August 2026. Fourteen problems (MAIS-O1, O10-O22) concern bounded and quantitative Löb, cooperative AI, and program equilibrium — the area where the atlas already ships Löb, Gödel I/II and Tarski. Checked 2026-08-07: MAIS-O1 and MAIS-O16 are not statable against AISafetyAtlas.Logic.loeb, which is the unbounded theorem; both need proof-length metrics, arithmetized bounded provability, and expansion certificates that neither Mathlib nor Foundation provides."
