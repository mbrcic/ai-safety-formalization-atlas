      "notes": "Everitt-Filan-Daswani-Hutter, AGI 2016, LNCS 9782, Theorem 12, at two abstraction levels. VERSION: the published chapter is canonical for statements and proves nothing, delegating every proof to the technical report arXiv:1605.03142, whose Theorem 16 is word-for-word the published Theorem 12 and is what older atlas notes cite. The optimal-policy-existence result those notes call Theorem 20 lives in the report's Appendix A and is invoked as the first step of the report's own proof, so the gap recorded here is real against the only proof that exists. GoalPreservationSource is the headline finite-percept one-step argument: it drops the atlas's earlier naming-surjectivity premise, compares the selected continuation only with the named initial policy, and uses a normalized full-support percept distribution to turn a strict pointwise loss into a strict expected loss. It is not the full or source-strength Theorem 16. initial_dominates and contValue are supplied rather than derived from modification independence and the source's Theorem 20; policy names and policies are not separated by an explicit naming map; expectations are finite discrete sums rather than integrals; and no all-times trajectory theorem is proved. SixTargets.finitePerceptGoalModel witnesses the interface with two percepts, a uniform full-support distribution, and a genuinely dominated continuation. The older deterministic GoalPreservation model is retained as a stronger-assumption specialization: next_policy_optimal is its load-bearing statement, run_optimal lifts it along the reached path, and goal_preservation is a corollary. Its names_surjective premise forces an infinite policy-name type with at least two world actions; SixTargets.twoActionGoalModel witnesses satisfiability. RELATED only; no off-policy preservation or AI-system bridge is claimed. Supporting self-modification theorem; no direct Table-1 coverage.",
