      "id": "LAND-HYPER-002",
      "name": "k-safety self-composition and hyperproperty decomposition",
      "tags": [
        "compositionality",
        "verification"
      ],
      "notes": "Clarkson-Schneider Theorem 2 in both presentations. The batch form uses unordered sets of at most k complete traces. The synchronized-product form k_safety_iff_product_self_composition uses the source ordered Fin k tuples, with the translation and its boundaries made explicit: toBatch is total and coalesces duplicates and order (card_toBatch_le, toBatch_perm), padding recovers a nonempty batch exactly (toBatch_padBatch), and for k greater than zero the empty batch has no product preimage at all, which productSelfComposition_empty and finiteSelfComposition_empty record. The transfer is therefore stated for the induced safety predicate rather than an arbitrary predicate, since selfCompositionSafe_empty_of_any shows the empty batch is subsumed by every other one while an arbitrary predicate could distinguish it; the product form additionally carries a nonempty-system hypothesis. The reduction proves both satisfaction equivalence and that the induced batch predicate has finite bad observations. The operational reading of the decomposition is now earned rather than asserted. PrefixTopology defines the observation topology as a function of the observation relation prefixOf, deliberately not as a global TopologicalSpace instance, since a global instance cannot mention prefixOf and would forget the observation semantics; it is installed locally with letI. Against that topology, isClosed_iff_hyperSafety and dense_iff_hyperLiveness prove that closed and dense mean exactly Clarkson-Schneider hypersafety and hyperliveness, stated independently of any topology, and hyperSafety_of_isKSafety supplies the inclusion joining the k-safety reduction to the decomposition. The generic arbitrary-topology decomposition is retained in the parent module and is no longer the operational claim. Independent Lean proof; it does not import the Rocq artifact or its prop_ext axiom. Non-Table-1 hyperproperty infrastructure; no survey headline coverage.",
