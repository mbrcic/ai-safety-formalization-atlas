      "notes": "Physical modelling layer over LAND-SELFMEAS-002, not a rewrite of Breuer's section 3.5 core, which continues to take ProperInclusion as model data. Composition derives it from a product or equivalent decomposition with an independently varying remainder, needing no finiteness; Finite derives it from a strict cardinality gap by pigeonhole. The Finite argument is Breuer's own section 3.4 First Attempt, where finitely many apparatus states are said to already exclude exact measurement of all states from inside; it is a bridge rather than the paper's result because section 3.4 is the route Breuer abandons, dropping its continuity variant as difficult to handle and taking the section 3.5 meshing approach instead. That continuity route, which forces equal phase-space dimension in classical mechanics, is not formalized. Composition has no section 3.4 counterpart and is atlas modelling. Both then apply the core no-go under meshing. The boundary has three regions rather than two: a non-injective restriction gives Proposition 1, a bijective one admits a meshing fibre inference map that measures every state, and an injective non-surjective one admits no meshing map at all. Explicit non-claims: not every physical containment has a nontrivial remainder or a cardinality gap, and Bekenstein-type bounds are not encoded as yielding one. Grade RELATED as atlas modelling relative to Breuer, not EXACT. No AI-system bridge. Axiom profiles and the three-region table are in the module docstring; evidence in docs/provenance/self-measurement-kernel.md.",
