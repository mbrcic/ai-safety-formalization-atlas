      "notes": "A bridge module over an oversight model, built on Ashby's counting bound (BY-004) and the knowability kernel. Sit is the set of situations an overseer is answerable for, Obs what it observes, Act its interventions, Out the outcomes; an overseer is a map Obs -> Act, so the policy is observation-mediated rather than omniscient, which is the conservative direction. Forces says the composed policy pins the outcome at a single target in EVERY situation, which is the strongest reading of 'oversight works' and therefore the reading whose necessary conditions are weakest. not_forces_of_card_lt: with fewer interventions than situations, and an effect table in which a fixed intervention still distinguishes situations, no policy forces the outcome - and the hypothesis list contains nothing about what the overseer observes, which is the theorem rather than an omission in it. forces_of_constant_effect is the other corner and the boundary of the first: an intervention whose effect is constant forces the target from a blind policy, and a constant column is exactly where the structural hypothesis fails. Examples.Oversight.VarietyBound exhibits both corners at three situations each and states them as one conjunction, so the independence is a checked object rather than prose. Taken alone the first theorem would be close to renaming Ashby's regulator an overseer, which methodology.md says does not earn a bridge grade; what is offered as more than a rename is the pair, a statement about the relation between two capacities that the oversight and control clusters formalize separately and neither states alone. A reviewer who rejects that reading should reject the bridge grade; the declarations are correct either way. Review package at docs/bridges/review-oversight-varietybound.md. Accepted at REVIEWED by the maintainer on 2026-08-17, statement and scoped interpretation both, as conditionals and licensing none of the package's forbidden claims. The decision is not recorded in this row: ai_bridge_status and bridge_review are rejected on rows without an informal_claim, which is every LAND- row, so the generated reviewed-bridge count reads 2 and understates it. The package records the decision and the three ways to make it recordable.",
