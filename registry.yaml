5 does not ask for it. entropy_outcome_ge_sub_channelCapacity is a necessary alphabet-ceiling bound and entropy_le_channelCapacity_of_complete is the form the exercises use; sufficiency is neither proved nor implied. Maintainer bridge review 2026-08-17 (REVIEWED): applies to the AI-facing bridge Oversight.not_forces_of_card_lt, which this row owns - statement and scoped interpretation accepted per docs/bridges/review-oversight-varietybound.md. It is NOT a reviewed AI-system reading of Ashby's law in general, and it licenses none of that package's forbidden claims: not that oversight does not work, not that monitoring is useless, not anything about a deployed system, not that more interventions suffice. The accepted reading is a conditional whose antecedent - fewer interventions distinct in effect than situations - nobody has established for any real overseer.",
