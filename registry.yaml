      "result_shape": "POINT_IMPOSSIBILITY",
      "notes": "Reads BY-039's CRMDP complement construction through the LAND-KNOW-001 kernel, with the environment as the unknown. An environment and its complement generate the same observed history but returns summing to the horizon, so a complement pair whose returns differ is a collision and not_knowable_of_collision applies. The primary statement is class-relative: it asks only that some admissible environment class contain such a pair, which is what makes the escape routes exact — restrict the class, add information, relax exactness, or move to a prior. The unrestricted corollary is witnessed at every positive horizon by the zero environment and its complement. The mathematics is not new: Everitt, Krakovna, Orseau, Hutter and Legg supply both ingredients and BY-039 already formalizes them. What this row adds is the factorization reading, the witness certificate, and the import edge making Wireheading a consumer of Knowledge. Quantification is over environments, not over agents: no decoder from observed histories is correct on every environment in the class. Explicit non-claims, including approximation and prior-conditional estimation, are in the module docstring; BY-039's non-claims are inherited.",
