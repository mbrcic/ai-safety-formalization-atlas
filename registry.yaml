      "id": "LAND-ANGLUIN-001",
      "name": "Port-labelled anonymous networks, views, and automorphisms",
      "tags": [
        "compositionality",
        "multi-agent"
      ],
      "notes": "Builds the network beneath AISafetyAtlas.Compositional.Symmetry, whose Protocol structure takes observational indistinguishability as a field. Here it is derived. runFor_eq_of_view_eq is the Angluin lemma: nodes whose views agree to depth n, meaning every port sequence of length at most n reaches equally-labelled nodes, are in the same state after n synchronous rounds, so an anonymous algorithm cannot see past the depth its messages have travelled. Automorphisms give the second route: invariant_of_automorphism shows a port-preserving permutation leaving the configuration invariant keeps it invariant through every round, and no_unique_leader_of_fixedPointFree concludes that a fixed-point-free automorphism rules out electing a unique leader, since the leader would have to be a fixed point. invariant_of_constant places the earlier constant-configuration symmetry inside this model. Deterministic and synchronous only, so Itai-Rodeh randomized symmetry breaking is out of scope. Message routing is simplified: the message received on port i is what the port-i neighbour sends on index i, rather than being routed back through the neighbour own port, which would need a port involution. The general covering and quotient machinery relating a network to its universal cover is not formalized. Upstream dependency for the survey-original BY-043. Not coverage of it; no status follows from this entry.",
