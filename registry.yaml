          "content_source_note": "Igel-Toussaint's Theorem 4, the argument the section exists to make: a non-trivial neighbourhood relation on the search space is not invariant under permutations of that space, so the characterization on this row is met by nothing that carries structure. Print defines the object at p. 318: 'A neighborhood relation on X is a symmetric function n: X x X -> {0,1}', non-trivial iff some pair of DISTINCT points neighbours and some pair of distinct points does not. exists_perm_rel_not_iff is that statement and its equation (6). forall_rel_of_permInvariant carries the proof: one instance of the relation at a pair of distinct points forces it at every pair of distinct points, by two-transitivity - a permutation assembled from two transpositions. rel_diag_iff_of_permInvariant is the diagonal half: an invariant relation is all-or-nothing off the diagonal and all-or-nothing on it, the two independently. No count is claimed or proved. forall_adj_or_forall_not_adj_of_permInvariant and exists_perm_adj_not_iff are the SimpleGraph corollaries, kept because that is the form a reader looking for graph automorphisms would search for. Examples.Learning.oneEdge_not_permInvariant is the smallest instance, one edge on three points. Examples.Learning.loopedEdge_not_permInvariant is that edge plus every self-loop: legal under print's definition, non-trivial in print's own sense, and not a SimpleGraph, so it is the witness the bare-relation form reaches and the graph form does not. Examples.Learning.top_permInvariant and Examples.Learning.bot_permInvariant occupy both branches of the graph dichotomy. Examples.Learning.eq_permInvariant is the diagonal, which is invariant but TRIVIAL in print's sense - it relates no two distinct points - so Theorem 4 says nothing about it; it is recorded to show the diagonal is a degree of freedom forall_rel_of_permInvariant does not constrain.",
          "build_environment": "leanprover/lean4:v4.31.0; mathlib@fabf563a7c95a166b8d7b6efca11c8b4dc9d911f",
          "build_command": "lake build AISafetyAtlas.Learning.Sharp AISafetyAtlas.Examples.Learning.Sharp",
          "scope_delta": {
            "summary": "Wider than print on two axes. forall_rel_of_permInvariant is stated for an arbitrary binary relation on an arbitrary type: no finiteness, no symmetry, no irreflexivity, and nothing about search in the statement. Print's neighbourhood relation is symmetric; the proof never uses symmetry, so the hypothesis is dropped rather than assumed. The search reading is a corollary. Modelling print's relation as a SimpleGraph would be NARROWER than print, since SimpleGraph is symmetric AND irreflexive whereas print asks only for symmetry and constrains n(x,x) not at all. Examples.Learning.loopedEdge_not_permInvariant is a relation print's definition admits and SimpleGraph cannot express, an edge plus every self-loop, so the graph form cannot be instantiated at it. That is applicability rather than strength: loopedEdge is symmetric, and for symmetric r the graph 'fun a b => a != b and r a b' carries both non-triviality clauses, so the conclusion stays derivable from the graph form. The axis that buys strength is symmetry, witnessed by Examples.Learning.arrowRel_not_permInvariant, where print's theorem cannot be posed at all since no symmetric relation on a two-element type meets both non-triviality clauses. Note print's next sentence, which cuts against the reading here: 'There are only two trivial neighborhood relations, either every two points are neighbored or no points are neighbored.' Print counts off-diagonal behaviour and treats n(x,x) as immaterial rather than as a parameter, so the free diagonal is an inference from a definition that omits it, not something print asserts.",
