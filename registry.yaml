    {
      "id": "LAND-KNOW-DEVICE-001",
      "name": "Transports between the knowability kernel and inference devices",
      "tags": [
        "information-theory",
        "oversight"
      ],
      "result_shape": "INFRASTRUCTURE",
      "notes": "Atlas modelling, not a claim of either Wolpert paper. LAND-KNOW-001's Knowable and BY-024's WeaklyInfers are not the same relation - that is a theorem of this development, witnessed both ways on finite models in Examples.Inference.Device, and Inference/Device.lean says so at length. Nothing here retracts it. What this row adds is the conditional half that was missing: the joint object is the device's own setup-and-conclusion pair read as a spine observation (deviceObservation), and an IndistinguishabilityWitness for that pair, lying inside a realized block, stops the block answering the probe. Present in every realized block and straddling the target value (BlockwiseCollision), it refutes Definition 3 and Definition 11 alike, and the physical-knowledge refutation holds for every context W because Definition 11's clause (i) constrains the whole selected block rather than its trace in W. The straddle clause is load-bearing rather than convenient: Examples.Knowledge.Devices exhibits an eight-state device whose every block carries a colliding pair with the target differing, and which weakly infers the target anyway, so the weakened hypothesis would be unsound rather than merely weaker. Travel in the other direction is one lemma: a device answering the probe in every realized block has its conclusion function equal to the probed target, so second projection decodes it. There is deliberately no Knowable-to-WeaklyInfers lemma and no iff between a collision-free block and an answering one; both fail, and the module docstring gives the countermodel for each. Axiom profile measured, not assumed: every refutation and the positive transport depend on no axioms at all, witnessAt reports propext, and the probe-free refutation reports the classical three because constructing a probe is where the choice sits. blockwiseCollision_of_knowable_concl discharges the hypothesis from two conditions an engineer can inspect without mentioning probes - the report factors through the setup, and no reachable configuration separates the value - and Examples.Oversight.Overseer runs both sides of that condition on one four-state system: an overseer whose report reads the world answers every probe while its report stream still does not determine the hazard, and an overseer whose report factors through its configuration is refuted at every configuration, every reconfiguration and every context. The first half is the non-obvious one: satisfying Definition 3 does not make the output decodable, because Definition 3 chooses the configuration per question while a decoder must work in all of them at once. AISafetyAtlas.Knowledge.Check supplies the executable half on the pattern FiniteDecision already sets for coverage - findCollision searches an enumeration for a witness, and the two agreement theorems are what make its output evidence rather than a report, with completeness of the enumeration a hypothesis rather than an instance because it is the whole content of the confirming direction. The lake exe atlas-check reads a finite model as JSON and prints the verdict with the declaration that certifies it; scripts/check_atlas_check.sh asserts that its answers on four shipped models match the Lean proofs in Examples.Oversight.Overseer for the same two devices. The output is what the kernel would give and not a proof term the kernel has checked for that instance, which the tool says itself. A coalition kind decides the joint-observation question over the same certified search, since Covers is definitionally Knowable on the coalition's observation; its shipped models mirror Examples.Oversight.JointObservation.Procurement and reproduce that file's documented failure witness independently. Every verdict reports the worst ambiguity alongside it, so a failing model states how far off it is rather than only that it failed.",
