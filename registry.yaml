      "notes": "Artifact for Abate, Blanco, Garg, Hritcu, Patrignani and Thibault, 'Journey Beyond Full Abstraction' (CSF 2019, arXiv:1807.04603). Mechanizes the Alpern-Schneider safety/liveness decomposition (safety = closed, liveness = dense, every trace property = safety intersect liveness) and the Clarkson-Schneider class hierarchy including subset-closed hyperproperties, hypersafety, 2-hypersafety, hyperliveness and relational hyperproperties. Found by manual GitHub search on 2026-07-28; it lies outside all six pinned corpora. Exact revision c68187c was tested unmodified. Coq 8.9.1, one of the README's claimed supported versions, and Coq 8.20 both compile Topology.v, TopologyTrace.v, Properties.v and most of the tree, then fail because `Stdlib.List` has no physical load-path binding. Therefore the repository-wide reproduction is FAILED, not reproduced; the principal declarations did kernel-compile before the unrelated late failure. Axiom caveat: Topology.v line 11 declares nonstandard `Axiom prop_ext : prop_extensionality`, used by decomposition_theorem. General arbitrary-k safety and the Clarkson-Schneider self-composition reduction are absent from this upstream tree; the independent axiom-audited Lean increment is LAND-HYPER-002. No Table-1 BY ID concerns hyperproperties; recorded as landscape evidence only.",
