      "notes": "Reproduced 2026-08-11 from AFP entry Chandy_Lamport (Ben Fiedler and Dmitriy Traytel, July 2020) at the pinned full AFP release 2026-02-06, Isabelle2025-2, BSD License. Session build exit 0, all seven theories, no errors; Finished Chandy_Lamport in 1:54 elapsed. The single-entry archive does not close — the Chandy_Lamport session parent is Ordered_Resolution_Prover, which itself needs Coinductive and Nested_Multisets_Ordinals — so reproduction goes through the full immutable release, the pattern already used for Deep_Learning and pinned to the same sha256. A POSSIBILITY result, catalogued as the escape boundary dual to the self-knowledge impossibility rows: a process can determine a consistent global state while the computation continues, so the honest obstruction concerns exact knowledge of the PRESENT state and never 'a system cannot know its own global state', which distributed snapshots falsify at useful engineering resolutions. Snapshots escape by relaxing contemporaneity. Path-A reproduction: built at upstream Isabelle, not vendored, no atlas Lean import surface, and no atlas declaration depends on it. Never counts toward headline EXACT/EQUIVALENT coverage. No AI-system reading without a separate reviewed bridge. Evidence: docs/provenance/embedded-self-knowledge-landscape.md.",
