      "notes": "Related-literature audit only; no claim row or paper-fidelity grade. The paper proposes a VC-capacity boundary for self-modification, but the displayed iff under A1–A7 is not supported as stated: its sufficiency proof additionally assumes all reachable classes lie in one fixed finite-VC reference family, which does not follow from a uniform bound on the VC dimension of each class. The Two-Gate oracle inequality also compares ERM in the final subclass with the infimum over the larger reference family without an approximation or optimization premise. See docs/guide/related-literature.md."
    },
    "atlas-ref-majumdar-2026": {
