    {
      "id": "LAND-SELFREF-001",
      "name": "The self-model as a component of the state it models",
      "tags": [
        "information-theory",
        "interpretability"
      ],
      "result_shape": "CHARACTERIZATION",
      "notes": "The layer where the observation stops being an arbitrary map. Every earlier knowability module states in its non-claims that nothing makes the observation a projection of a state containing the observer; here the observer's model IS a component of the global state, written Model x Rest, and selfRead is the projection onto it. Self-reference is then forced rather than assumed: the target is the whole state, which includes the Model component, so a complete self-model must model itself. selfComplete_iff_subsingleton_rest says complete self-knowledge holds if and only if the remainder is a subsingleton — achievable, but only degenerately, which is what makes it a characterization rather than a blanket denial. not_selfComplete_of_two_rest is the axiom-free direction, exhibiting the colliding pair. card_rest_le_one_of_selfComplete is the counting form and is proved through LAND-AMBIG-001's card_image_le_of_knowable rather than by a fresh argument: the state carries |Model| * |Rest| values while the reading carries at most |Model|, so completeness is a cardinality inequality only |Rest| <= 1 can satisfy. That makes it the first consumer of the ambiguity layer outside Examples. AISafetyAtlas.Examples.Knowledge.SelfReference inhabits both directions, including the degenerate one, so the iff is not an impossibility in disguise. Explicit non-claims: this is NOT Breuer's theorem, which is LAND-SELFMEAS-002 and models the apparatus with an inference map and meshing rather than assuming a product decomposition; there is no regress or hierarchy over models of models, the obstruction being one level deep; there is no resource bound, budget or process count; and there is no dynamics, so nothing here says the state changes while being modelled — composing with LAND-TEMPORAL-001 is the obvious next step and is deliberately not taken. Model and Rest are arbitrary types and are not interpreted as memory, computation or belief. Nothing here concerns consciousness: incompleteness of a self-model is a statement about a projection, and every partially observed embedded system has it, which is exactly why it cannot be evidence of anything phenomenal. No AI-system reading follows without a separate reviewed bridge.",
