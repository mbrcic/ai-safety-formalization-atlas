          "content_source_note": "Igel-Toussaint state Theorem 1 for 'any two (deterministic or stochastic, cf. [1]) algorithms a and b', citing Droste-Jansen-Wegener on randomized search heuristics. Everything else on this row quantifies over AdaptiveRule, which is deterministic, so the atlas covered a subclass of the printed one. StochasticRule closes that: a rule reads a choice at each step alongside the costs it has seen, and induced fixes the choice sequence to give a deterministic rule DEFINITIONALLY. The theorem is that two stochastic non-repeating rules over possibly different choice alphabets score alike against a permutation-invariant weighting, provided their choice weights carry the same total mass. no_free_lunch_stochastic_of_sharp is the printed uniform case with both masses one.",
          "build_environment": "leanprover/lean4:v4.31.0; mathlib@fabf563a7c95a166b8d7b6efca11c8b4dc9d911f",
          "build_command": "lake build AISafetyAtlas.Learning.Sharp AISafetyAtlas.Examples.Learning.Sharp",
          "scope_delta": {
            "summary": "The modelling choice is the content. Randomness is NOT modelled as a weighted family of deterministic rules: that would prove only that No Free Lunch is preserved under mixtures, and would leave the residual it is meant to close, since nothing would say the source's algorithms ARE such mixtures — the same shape as the openLoopMax family residual on BY-005, which needed isPurification_purifyMap to close. Here the randomness sits where a randomized heuristic puts it, at the step, so induced needs no representation theorem. An arbitrary weight on choice SEQUENCES allows correlated choices, so independent per-step randomization is a special case and so is the abstract mixture picture, by taking the choice alphabet to index rules. The finite-choice residual recorded when this landed is CLOSED, at the primary source. Droste-Jansen-Wegener, Theoretical Computer Science 287 (2002) 131-144, is Igel-Toussaint's reference [1]; its Theorem 1 is stated for 'an arbitrary (randomized or deterministic) search heuristic' and its randomized half reads, at p. 134: 'The number of different deterministic search strategies is finite. Let m be its number. A randomized search strategy is a probability distribution p = (p1, ..., pm) and chooses the ith deterministic strategy with probability pi. ... the expected cost of a randomized search heuristic is the weighted average of the cost of the deterministic search heuristics. Since all deterministic search heuristics have the same cost, this also holds for all randomized search heuristics.' So the mixture model is DJW's definition rather than a rendering of one, finiteness of the strategy set is DJW's own observation rather than an atlas restriction, and the final sentence is mixtureTrace_eq_sum_mul, so the atlas proof follows the printed one step for step. Igel's own later survey (igel-2014) says the same in secondary form. mixtureTrace is that equation and nfl_mixture_of_permInvariant is the theorem over it, so the printed quantifier is met at the source's own definition. A is finite because X and Y are, and surjective_induced_playChoice records that the choice-sequence form reaches all of it. mixtureTrace_pointMass is the survey's remark that deterministic algorithms are the degenerate distributions. Nonempty on the choice alphabet remains a hypothesis print does not state, and applies only to the choice-sequence form. Examples.Learning.coinRule_realizations_differ checks the quantifier is not decoration — two choice sequences induce rules that open at different points — and nfl_coinRule_vs_probeRule scores that coin against the branching deterministic probeRule.",
