      "notes": "When can a hazard be decided from what a coalition of principals is permitted to observe. EvidenceArchitecture separates private evidence from declared emitted views, while CoalitionInput enforces coalition access in the type of a candidate computation. Covers is factorization through one uniform decision rule; covers_iff_no_collision separately characterizes failure by a concrete safe/hazardous collision. decideCoverage is the certified finite decision over an explicit complete ExecutionEnum. Post-processing an unchanged output cannot repair a collision, while genuine refinement preserves coverage. Everything holds under the fixed truthful mechanism M0; no strategic incentive, permissibility, or normative safety claim follows. The four-state Procurement example checks singleton and complete-emitted-interface failures plus one narrow joint success. The bounded synthesis target adds indexed hazard and candidate families, finite portfolios, per-candidate PortfolioCovers, pointwise PortfolioIndistinguishable, and portfolioCovers_implies_hazardEquivalent; the converse is not claimed because individually insufficient outputs are not fused for free. InclusionMinimalCovering and CostOptimalCovering are distinct, with inclusionMinimal_of_costOptimal proving the positive-cost implication. A second three-principal, eight-execution example uses qCD over {C,D}, qDE over {D,E}, and qCDE over {C,D,E}. The narrow portfolio {qCD,qDE} and broad singleton {qCDE} both cover two hazards and are inclusion-minimal; declared coordination-plus-disclosure costs 6 and 7 make only the narrow portfolio cost-optimal. Coverage is reduced once to a decidable membership condition for exhaustive instance proofs. This is checked target semantics, not a synthesizer: nothing generates candidates, searches a mechanism library, validates the cost model, or establishes optimality outside the declared family. Oversight observation-architecture mathematics, not a Table-1 impossibility resul