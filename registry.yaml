      "locator": "https://arxiv.org/abs/2601.17335",
      "role": "work",
      "retrieved": "2026-08-12",
      "notes": "Related-literature audit only; no claim row or paper-fidelity grade. The intended certification argument is Rice-shaped, but semanticity and nontriviality on an arbitrary effectively presented admissible-agent subclass do not suffice for Rice's theorem without an acceptable numbering, universality, or a property-preserving reduction. The self-certification corollary adds no independent self-reference mechanism, and the Tarski-style proof additionally assumes unprovided completeness for negative instances. See docs/guide/related-literature.md."
    },
