      "result_shape": "CHARACTERIZATION",
      "notes": "When a hazard can be decided from what a coalition of principals is permitted to observe. EvidenceArchitecture separates private evidence from declared emitted views, and CoalitionInput enforces coalition access in the type of a candidate computation. Since the LAND-KNOW-001 kernel landed, Covers is definitionally Knowable q.observe and Refines is Determines, so the coverage laws are the generic kernel applied to q.observe rather than separate arguments, with every statement and axiom profile unchanged. What remains coalition-specific is the evidence architecture, the typed coalition restriction, the collision certificate, the certified finite checker decideCoverage over an explicit execution enumeration, and the bounded portfolio target with its inclusion-minimal and cost-optimal notions. Two worked architectures exhibit the failures and one narrow joint success. This is checked target semantics, not a synthesizer: nothing generates candidates, searches a mechanism library, or validates the cost model. Residual adds the distribution-free quantitative face of coverage: worstResidual counts how many target values the worst single output still leaves open, covers_iff_worstResidual_le_one identifies coverage with the residual-at-most-one case, and worstResidual_le_postprocess is the repair boundary as a comparable number. Residual counts executions and never weighs them, so there is no probability, prior, expectation or entropy anywhere in it. A residual of one fixes every state-attribution question; it says nothing about whether a principal reported honestly. Everything holds under the fixed truthful mechanism M0; no strategic, permissibility, accountability or normative safety claim follows.",
