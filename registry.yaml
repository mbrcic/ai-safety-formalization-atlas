      "id": "LAND-KNOWENTROPY-001",
      "name": "Knowability measured: zero conditional entropy, and Fano's floor on every decoder",
      "tags": [
        "information-theory",
        "interpretability"
      ],
      "notes": "Joins the knowability kernel to the entropy layer, in the one direction that holds exactly. condEntropy_eq_zero_of_knowable: a decoder costs no entropy, proved from InformationTheory.condEntropy_comp_self_left. not_knowable_of_condEntropy_ne_zero is the contrapositive and the usable direction - an estimated entropy certifies unknowability without ever naming the colliding pair, where IndistinguishabilityWitness requires exhibiting one. le_errorProb_of_decoder is the quantitative form: EVERY decoder built from the observation, not merely some decoder, errs with probability at least (H[property | observation] - log 2) / log |A|. It is reached by instantiating Fano's converse (InformationTheory.le_errorProb, Cover and Thomas 2.132) at the decoder's output and then transferring the bound back to the observation along data processing, since a decoder is a coarsening and isMarkovChain_comp plus condEntropy_le_condEntropy_of_isMarkovChain say coarsening never lowers conditional entropy. No new information-theoretic content is claimed; the constant is Cover and Thomas's. The converse fails and the failure is exhibited rather than asserted: Examples.Knowledge.Entropy carries a property that is not Knowable whose conditional entropy is zero, by putting a point mass on one of two colliding states. Entropy answers a question about the measure and Knowable answers a question about every state, so entropy is a sound certificate of unknowability and an unsound certificate of knowability. No AI-system reading is asserted: observation is an arbitrary measurable map.",
