      "source_note": "Scope is Same, and the epsilon range is gone from the Prop rather than explained away. IsPolyLogBudget and NonadaptiveWithinConstant both quantified over eps below a supplied eps_0. A second quantifier defect on the same predicate was closed on 2026-08-23: NonadaptiveWithinConstant bound its constant c existentially and was applied inside the for-all over sk and modelClass, so the Prop allowed one adaptivity constant per model class. prob:exact asks whether adaptive queries beat non-adaptive ones by more than a constant factor, with constants depending on (m, K, lambda, L, rho); a class is not among those, so a per-class constant states something weaker than print and the row had been graded Same against the easier statement. c is now a parameter of the predicate, quantified beside A and d before the skeleton and the class. Both now quantify over every eps in (0,1), which is prob:exact's own sentence and the domain on which log(1/eps) is positive. The argument that had justified eps_0 was wrong. It said an unrestricted bound would force N(eps) = 0 as eps approaches 1, since A * P * log(1/eps) falls to zero, and called that a demand the poly-log idiom does not address. N(eps) = 0 near eps = 1 is not absurd but expected: the zero-query minimax risk is the error of the best fixed guess, which is strictly below 1 on any class of positive diameter, so N(eps) is already 0 for every eps above it. Below that point N(eps) is positive and log(1/eps) is bounded away from zero, and A is existentially quantified before the diagram, so a large enough A satisfies the bound there. Examples.Causal.OneNodeClass makes the shape concrete: its class is the interval [lambda, 1-lambda] under one graph, the guess 1/2 is wrong by at most 1/2 - lambda, and N(eps) vanishes above that. A satisfiable printed sentence licenses no repair. Nor does conj:exact license one: it writes the same quantity as eps -> 0, so rendering the two halves of one decide-clause differently would itself be a defect. conj:exact is MAIS-O26 and prob:exact is MAIS-O25. They are different printed statements and the convention of one does not transcribe the other. not_isPolyLogBudget_of_top and not_nonadaptiveWithinConstant_of_top were restated against the wider predicate: any single infeasible target in (0,1) now refutes the bound, where before a witness could choose an eps_0 above it. Non-vacuity is closed. Fidelity is Selected and not Bridged, which would have recorded the epsilon range and nothing else: prob:exact attaches no range to eps, IsPolyLogBudget supplied an eps_0, and the tag recorded that the conventional reading was being used in place of the printed quantifier. Both predicates now quantify over every eps in (0,1), so there is no reading standing in for a quantifier any more. Selected stays, because this row states prob:exact's decide-clause and not the rest of the problem. The tag was also, by its own note, added 'for internal consistency with CONJ-003 and CONJ-010 rather than for a new fact' -- consistency with a tag CONJ-003 has now also dropped is not a reason to keep it. This field states the current grade and its reason only."
