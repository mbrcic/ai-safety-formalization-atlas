      "status": "RESOLVED",
      "resolution": "Coverage: this row is prob:boltzmann(a) only. MAIS-O29 has three clauses and RESOLVED here is the status of this row's Lean Prop, not of the printed problem. Part (b) is answered at one instance by CONJ-016 and part (c) is blocked, and neither follows from (a): a negative answer to (a) constrains (b), since non-identifiability can floor the risk, but does not determine it, and it bears on (c) not at all. Resolved negatively on the source's real chart by AISafetyAtlas.Examples.Conjectures.MAIS.maisO29_boltzmannNotInjective_holds, at every positive beta, with the two-variable skeleton supplied as the witness for the source's existential over skeletons. The MAIS-O23 witness pair is also a Boltzmann collision at every positive inverse temperature: because the skeleton observes nothing, each response probability is a softmax of the full expectations E[u d], and the utility u d v = (1 +/- g v)/2 makes those expectations (1 +/- Delta)/2, so their sum is the total mass 1 and their difference is the behavioral transform. Equal transforms therefore pin both scores and hence the softmax, uniformly in beta. ATTRIBUTION: the colliding construction is MAIS issue #6's; the source does not connect MAIS-O29 to MAIS-O23, and the transfer step is the atlas's. modelError is print's own e. What this row does not claim: boltzmann_minimax_floor proves a deterministic estimator reading only the Boltzmann responses is maximally wrong on one of the two colliding models, at every positive temperature and independently of budget. That is not a lower bound on the randomized minimax risk prob:boltzmann(b) names -- deterministic strategies are a subset of randomized ones, so a lower bound on the larger infimum carries no information about the smaller. The two-point argument at print's own quantifier landed on 2026-08-23: AISafetyAtlas.Conjectures.MAIS.O29Experiment builds the sampled experiment -- the exact-oracle protocol with the policy-probability oracle replaced by one Bernoulli response and the adversarial policy family dropped, since the Boltzmann law is pinned by the model and beta -- and runBoltzmannTranscript_congr proves two Boltzmann-indistinguishable models induce the SAME transcript law at every budget, so no sampling separates them. half_le_boltzmannMinimaxRisk_of_collision then floors the randomized minimax risk at 1/2, and Examples...half_le_boltzmannMinimaxRisk_collision instantiates it on this row's own witness over the full margin class, uniformly in the budget and in beta. boltzmannMinimaxRisk_le_one supplies the other side, so Examples...boltzmannMinimaxRisk_collision_bounds DETERMINES prob:boltzmann(b)'s quantity up to a factor of two at this skeleton, uniformly in the budget and in beta: the rate is Theta(1), so there is nothing to deteriorate as beta -> 0 and no (N,beta) crossover to characterize, because the risk never decays. That is (b) at one print-legal instance and not at every one, the same standing as the MAIS-O27(a) negative instance; on a class where the risk does decay, none of (b) is touched. The floor's graph condition is load-bearing rather than incidental: without it modelError is the table supremum rather than 1, one_le_modelError_add does not apply, and the floor is not 1/2, so a same-graph Boltzmann collision does not floor the risk. This row remains prob:boltzmann(a) only: (b) is a determine-clause and no truth-valued Prop is Same as it. This row stays prob:boltzmann(a) only. Print's remark that large beta creates no regret floor is not contradicted: this obstruction is non-identifiability at every beta. The module header of AISafetyAtlas/Examples/Conjectures/MAIS/O29.lean states the same distinction beside the theorem.",
