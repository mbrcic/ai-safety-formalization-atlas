      "source_note": "Beyond/AtlasOriginal, corrected from Same/Literal on 2026-08-21. There is no printed sentence here to transcribe, and the entry's own fields said so two rows away: prior_art records that Wolpert 2008 section 8 'gives no proof of either direction' and that 'No source consulted addresses necessity', while proposed_by records that the hypothesis's necessity 'is asserted nowhere in the source'. Grading that Literal claimed a printed counterpart the paper does not contain. What the source does contain is the equality itself, which the atlas proves as stochasticInferenceComplexity_eq; the question of whether its hypothesis is needed is the atlas's, asked about that result. survey-ref-005 stays in source_ref as the artifact the question is about. One reading choice is worth recording and previously had nowhere to go: the negated universal is pinned at Type 0 rather than left polymorphic, because Checks.lean cannot name a universe-polymorphic Prop without metavariables. Restricting a *negated* universal makes the claim strictly stronger, so this is not a narrowing -- a Type 0 counterexample refutes the polymorphic theorem."
