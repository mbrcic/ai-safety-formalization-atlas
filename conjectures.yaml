model class in prob:exact, and as a demand on the answer in prob:starter-set(a), 'Determine, as an explicit semialgebraic condition on (u, theta)'. prob:floor says only 'decide for which pairs (s, delta)', and for clause (b) 'as an explicit function of (sk, lambda)' without defining explicit. A hypothesis in one printed problem does not impose an answer language on another, so grading this row against a semialgebraic demand would make it NARROWER THAN PRINT. This field asserted that grading, and IsO27EdgeSurvivalAnswer was registered here, until it was corrected against the printed text; the declaration remains in the tree as an atlas strengthening offered for study and is named in no admissibility field. TWO REASONS IT WOULD NOT HAVE DONE THE JOB EVEN IF PRINT ASKED FOR IT. Causal.IsSemialgebraic is an existential, so the canonical region together with a proof that it happens to be semialgebraic satisfies the conjunction and the restatement survives; a language that excludes it must make the pieces DATA -- a finite list of polynomial sign conditions, its interpretation as a plane set, and a theorem equating that with the survival region. And whether the printed region IS semialgebraic is open: plausible, since the tables are finitely many reals and the margin and edge-strength conditions are polynomial inequalities and Tarski-Seidenberg carries real quantifiers, but InIdentifiedSet quantifies over a policy family indexed by every real intervention mixture, and reducing that function-valued existential to a first-order real formula is a step no theorem in the tree takes. WHAT A SOLVER SHOULD SETTLE. Clauses (a) and (b) are chartable, contrary to what this field said: with C, dim and the two Finsets fixed, a skeleton's utility field is finitely many reals cut out by utility_parents' linear equalities and the [0,1] box, so a fibrewise semialgebraic condition on the locus, or on the graph of the function, is definable. What is missing is the warrant to demand it, and -