sNodeMass_iff_class prove the chart-quantified predicates EQUIVALENT to their statements against every model of the printed class carrying the chain graph, so the conjecture is about print's comparison class and not a smaller one. Before 2026-08-23 that equivalence did not exist and this row's Same grade rested on the chart quantifier alone. O31ChainModel.Δ_toModel_endpointGap proves the actual utility transform is the threshold-centered endpoint marginal up to its nonzero scale; o31BehaviorEqAt_threshold_iff_utilityKernel transports the chart relation to shared-optimum behavior computed from those kernel models; and shareBinaryOptimum_iff_exists_common_action proves that its sign condition means a shared optimal binary action. Non-vacuity is checked on both chambers by o31_antecedent_inhabited and o31_sameSide_antecedent_inhabited. What remains unsettled is the conjecture itself: the straddling positive identification claims, the node-mass claim, the two transition coordinates at n = 1, and the general n >= 2 classification."
