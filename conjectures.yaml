      "source_note": "Scope Same, fidelity DetermineProblem. The risk is print's own: an infimum over randomized adaptive analysts of the supremum over the class of the expected error, with print's error function and print's Boltzmann channel. IsBoltzmannRiskRate is the specification a candidate rate must satisfy, with the two constants quantified BEFORE the budget and the inverse temperature -- which is what 'up to constants' means, and what gives the statement content, since constants allowed to depend on (N, beta) could bracket anything. The specification is satisfied at one instance and that is checked: Examples.Conjectures.MAIS.isBoltzmannRiskRate_collision proves the risk is Theta(1) on the collision class -- it lies between one half and one at every budget and every positive beta -- so there is no deterioration as beta tends to zero and no (N, beta) crossover there, because the risk never decays. The three numbers are easy to confuse, and 'the constant rate 1' reads as a risk value when it is not one. The rate function is the constant 1 and the implied constants are one half and one, so the statement about the risk is that it lies in that interval. The lower half is over RANDOMIZED adaptive analysts and is the number with content; the upper one is trivial, since print's error is bounded by one. Neither is boltzmann_minimax_floor's one, which bounds a DETERMINISTIC estimator's error against the model it misses and is not a bound on print's quantity, since deterministic strategies are a subset of randomized ones and a lower bound on the larger infimum says nothing about the smaller. A specification nobody has satisfied is indistinguishable from one that cannot be. Where the risk does decay none of (b) is touched, and any answer with a square root of N in it lives on a class excluding graph-differing Boltzmann collisions. admissibility_status is Unformalized, AND WHAT IS MISSING IS A CHOICE RATHER THAN A PROOF. The answer is a rate function N -> beta -> R, and nothing in IsBoltzmannRiskRate stops a candidate from being defined as the minimax risk itself divided by a constant, which satisfies the specification and answers nothing. Excluding that needs a grammar the rate must be written in -- products of powers of N and beta with logarithms is the usual one, and print's own phrasing 'up to constants' and 'the smooth local rate' presumes something of the kind without naming it. The atlas does not impose one, because the grammar is a modelling decision about what MAIS-A2 accepts as a rate and print does not make it: too narrow a grammar makes the problem unanswerable, too wide readmits the circular answer. A SOLVER SHOULD STATE THE GRAMMAR THEIR ANSWER LIVES IN. The one rate this row does exhibit, fun _ _ => 1 in isBoltzmannRiskRate_collision, is a constant and therefore lies in every candidate grammar, so the instance already checked is not sensitive to the choice."
