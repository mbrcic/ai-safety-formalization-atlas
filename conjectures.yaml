  "description": "Open questions with a compiling Lean statement and no proof. A conjecture is a first-class deliverable: stating a safety property precisely enough to be checkable is the hard part, and the statement is useful before anyone proves it. Nothing here is asserted. Conjecture modules live under AISafetyAtlas.Conjectures.*, are never on the atlas root import, and never enter theorem counts. Tag vocabulary is shared with registry.yaml.",
  "conjectures": [
