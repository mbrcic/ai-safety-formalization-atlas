      "id": "CONJ-002",
      "statement": "Wolpert 2008 section 8's collapse of stochastic inference complexity to Definition 6 at accuracy 1 genuinely needs its no-null-point hypothesis. `stochasticInferenceComplexity_eq` proves `C-bar_1(Gamma | C) = script-C(Gamma | C)` under the source's `P proportional to d-mu` condition, rendered as `hatom` in the single-measure formulation this atlas uses: no point of the space is null. The conjecture is that theorem with `hatom` deleted and nothing else changed, negated -- so a counterexample is a probability space, device, length function and target meeting every remaining hypothesis, including measurable agreement and positive mass on every realized setup fibre, at which the two complexities differ.",
      "refutation": "Prove `stochasticInferenceComplexity_eq` without `hatom`, leaving every other hypothesis in place. That shows the hypothesis was never needed and the theorem can simply be strengthened.",
      "prior_art": "D. H. Wolpert, Physical limits of inference, Physica D 237(9):1257-1281, 2008, §8 running text after Definition 10 (survey-ref-005). The source states the equality with the proportionality condition and gives no proof of either direction; the `≤` direction is `stochasticInferenceComplexity_le` and needs no such condition. No source consulted addresses necessity. The distinction is the standard measure-zero versus empty gap and is not specific to this paper, but the atlas found no statement of it for this quantity.",
