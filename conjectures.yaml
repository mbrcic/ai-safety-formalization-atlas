      "statement": "MAIS-O25's two decide-clauses, at print's own scope, taking the yes branch of the poly-log bound and the no branch of the adaptivity question: there is one polynomial, fixed before any diagram or class, such that for every compact semialgebraic class of real binary causal models whose margin-class chart dimension is K, which is behaviorally injective, which has linear recovery over the printed identified set below an explicit threshold, and whose table-parameter projection contains a K(G)-dimensional box of side rho inside one fixed graph, the minimal budget N(epsilon) of the randomized exact policy-probability minimax risk is finite and at most that polynomial in (K, 1/lambda, L, 1/rho) times log(1/epsilon) for every epsilon in (0,1) -- and non-adaptive queries cost at most a constant factor more than adaptive ones.",
      "refutation": "Give a class satisfying ExactClassAssumptions for which no polynomial in (K, 1/lambda, L, 1/rho) fixed independently of the class bounds Causal.exactMinimalBudget by that polynomial times log(1/epsilon) -- including the case where that budget is top, since an infeasible target refutes a finite bound -- or for which the non-adaptive budget is infinite, or exceeds every constant multiple of the adaptive budget, as epsilon tends to zero.",
      "prior_art": "MAIS-A2 Problem 4.3 and MAIS-O25. The source asks to determine the rate and, in particular, to decide two things: whether N(eps) <= poly(K, 1/lambda, L, 1/rho) log(1/eps), and whether adaptivity gives more than a constant factor. The Lean proposition states one branch of each, and they point OPPOSITE WAYS: IsPolyLogBudget is the YES to the first -- the bound holds -- and NonadaptiveWithinConstant is the NO to the second, since the non-adaptive budget being within a factor c of the adaptive one is adaptivity NOT outperforming by more than a constant. The three axes that would otherwise make it Mixed are closed: real tables, prob:exact's compact semialgebraic class with its literal K(G)-dimensional box, the printed identified set in the recovery modulus, and the randomized-analyst infimum of subsec:queries with an Nat-infinity-valued N(eps). The last axis, the estimator's output law, closed too: the PMF rendering is countably supported where print constrains it not at all, but Causal.measureMinimalBudget_eq_exactMinimalBudget proves N(eps) is the same number under either reading, so the restriction costs nothing and that axis is closed. The row is Same from 2026-08-21: IsPolyLogBudget and NonadaptiveWithinConstant both quantify over every eps in (0,1), which is prob:exact's own scope, and the eps_0 that had made this Narrower is deleted from the Prop rather than explained away. The argument that had justified eps_0 was itself wrong: it held that an unrestricted bound forces N(eps) = 0 near eps = 1 and that this is a demand the poly-log idiom does not address, but N(eps) = 0 there is expected -- the zero-query minimax risk is the error of the best fixed guess, which is below 1 on any class of positive diameter. This field states the current grade and its reason only.",
